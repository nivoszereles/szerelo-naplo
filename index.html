/* ---------- HELPERS ---------- */
function pad(n){ return n<10 ? "0"+n : ""+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function monthStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function daysInMonth(ym){ var parts=ym.split("-"); return new Date(parseInt(parts[0]),parseInt(parts[1]),0).getDate(); }
function fmtFt(n){ return Math.round(n).toLocaleString("hu-HU")+" Ft"; }
function fmtDate(iso){ var p=iso.split("-"); return p[2]+"."+p[1]+"."; }
function fmtDateFull(iso){ var p=iso.split("-"); return p[0]+"."+p[1]+"."+p[2]+"."; }
function diffDays(a,b){ return Math.round((new Date(a)-new Date(b))/86400000); }
function weekday(ym,day){ return new Date(parseInt(ym.split("-")[0]),parseInt(ym.split("-")[1])-1,day).getDay(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function getPerson(id){ return STATE.people.find(function(p){ return p.id===id; }); }
function isLocked(trade,month){ return STATE.monthLocks.some(function(l){ return l.trade===trade && l.month===month && l.locked; }); }
function entryFor(personId,date){ return STATE.entries.find(function(e){ return e.personId===personId && e.date===date; }); }
function missingDaysThisMonth(personId){
  var today = todayStr();
  var month = today.slice(0,7);
  var dim = daysInMonth(month);
  var missing = [];
  for (var d=1; d<=dim; d++){
    var dateStr = month+"-"+pad(d);
    if (dateStr > today) break;
    var wknd = weekday(month,d)===0 || weekday(month,d)===6;
    if (wknd) continue;
    if (!entryFor(personId, dateStr)) missing.push(dateStr);
  }
  return missing;
}
function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

var AJTO_GROUP_ORDER = ["ajto","epulet","kiegeszito"];
var AJTO_GROUP_LABELS = { ajto: "Ajtó típusok", epulet: "Épület típusok", kiegeszito: "Kiegészítők" };
function groupAjtoItems(items){
  var buckets = {};
  items.forEach(function(it){
    var g = it.group || "kiegeszito";
    if (!buckets[g]) buckets[g] = [];
    buckets[g].push(it);
  });
  return AJTO_GROUP_ORDER.filter(function(g){ return buckets[g] && buckets[g].length; })
    .map(function(g){ return { key:g, label:AJTO_GROUP_LABELS[g], items:buckets[g] }; });
}

function roleKey(role){
  if (role === "Vezető szerelő") return "vezeto";
  if (role === "Segéd szerelő") return "seged";
  return null;
}

function timeToDecimal(t){
  if (!t) return null;
  var parts = t.split(":");
  if (parts.length<2) return null;
  var h = parseInt(parts[0],10), m = parseInt(parts[1],10);
  if (isNaN(h) || isNaN(m)) return null;
  return h + m/60;
}
function workedHoursOf(entry){
  var s = timeToDecimal(entry.workStart), e = timeToDecimal(entry.workEnd);
  if (s==null || e==null) return null;
  var diff = e - s;
  return diff>0 ? diff : null;
}
function keritesOverrideItem(entry){
  var kitems = STATE.catalog.kerites.items;
  for (var i=0;i<kitems.length;i++){
    if (kitems[i].override && entry.items && entry.items[kitems[i].key] > 0) return kitems[i];
  }
  return null;
}
function keritesHourBreakdown(entry){
  var perf, overrideItem = keritesOverrideItem(entry);
  if (overrideItem){
    perf = overrideItem.hoursPerUnit;
  } else {
    var kitems = STATE.catalog.kerites.items, unitHours = 0;
    for (var j=0;j<kitems.length;j++){
      var qk = (entry.items && entry.items[kitems[j].key]) || 0;
      unitHours += qk * kitems[j].hoursPerUnit;
    }
    var fixed = unitHours>0 ? (STATE.catalog.kerites.fixedDailyHours.utazas + STATE.catalog.kerites.fixedDailyHours.jarulekos) : 0;
    perf = unitHours + fixed;
  }
  var clocked = workedHoursOf(entry);
  var topUp = (clocked!=null && clocked>perf) ? (clocked-perf) : 0;
  return { perf: perf, clocked: clocked, topUp: topUp, overrideItem: overrideItem };
}
function isHourAnomaly(entry){
  if (!entry || entry.trade!=="kerites" || entry.dayType!=="work") return false;
  var b = keritesHourBreakdown(entry);
  return b.clocked!=null && b.perf > b.clocked * 1.2;
}
function keritesHoursInfoHtml(entry){
  if (entry.dayType !== "work") return "";
  var b = keritesHourBreakdown(entry);
  var html = b.overrideItem
    ? '<div class="recent-item"><span>Teljesítmény óra</span><span class="mono">'+b.perf.toFixed(1)+' óra ('+escapeHtml(b.overrideItem.label)+' — fix)</span></div>'
    : '<div class="recent-item"><span>Teljesítmény óra</span><span class="mono">'+b.perf.toFixed(1)+' óra</span></div>';
  if (b.clocked!=null){
    html += '<div class="recent-item"><span>Ledolgozott idő</span><span class="mono">'+entry.workStart+'–'+entry.workEnd+' ('+b.clocked.toFixed(1)+' óra)</span></div>';
    if (b.topUp > 0.001){
      html += '<div class="recent-item"><span>Órabéres pótlás</span><span class="mono">+'+b.topUp.toFixed(1)+' óra</span></div>';
    }
  } else {
    html += '<p class="muted" style="font-size:.8rem">Nincs rögzítve munkaidő ehhez a naphoz.</p>';
  }
  return html;
}

function calcEntryValue(entry, person){
  if (!entry) return 0;
  if (entry.dayType === "vacation" || entry.dayType === "sick"){
    var rk = roleKey(person.role);
    if (!rk) return 0;
    var table = STATE.dailyPay && STATE.dailyPay[entry.dayType];
    return (table && table[rk]) || 0;
  }
  if (entry.dayType !== "work") return 0;
  if (person.trade === "ajto") {
    var items = STATE.catalog.ajto.items, itemsTotal = 0, anyQty = false;
    for (var i=0;i<items.length;i++){
      var q = (entry.items && entry.items[items[i].key]) || 0;
      if (q>0) anyQty = true;
      itemsTotal += q * (person.prices[items[i].key]||0);
    }
    var travel = anyQty ? (person.travelFeePerDay||0) : 0;
    var assembly = (entry.assemblyHours||0) * STATE.catalog.ajto.assemblyHourlyRate;
    return itemsTotal + travel + assembly;
  } else {
    var b = keritesHourBreakdown(entry);
    var payHours = b.clocked!=null ? Math.max(b.perf, b.clocked) : b.perf;
    return payHours * (person.hourlyRate||0);
  }
}

function monthEntries(personId, month){
  return STATE.entries.filter(function(e){ return e.personId===personId && e.date.slice(0,7)===month; });
}
function monthPieceTotal(personId, month){
  var person = getPerson(personId), sum=0;
  monthEntries(personId, month).forEach(function(e){ sum += calcEntryValue(e, person); });
  return sum;
}
function monthExtrasTotal(personId, month){
  return STATE.extras.filter(function(x){ return x.personId===personId && x.month===month; })
    .reduce(function(s,x){ return s + (x.amount||0); }, 0);
}

/* ---------- MENTÉS / BETÖLTÉS (Supabase) ---------- */
function sb(path, opts){
  opts = opts || {};
  var headers = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY };
  if (opts.body) headers["Content-Type"] = "application/json";
  if (opts.prefer) headers["Prefer"] = opts.prefer;
  return fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){ throw new Error(t); });
    if (r.status === 204) return null;
    return r.text().then(function(t){ return t ? JSON.parse(t) : null; });
  });
}
function sbUpsert(table, rows, conflictCols){
  return sb(table + "?on_conflict=" + conflictCols, {
    method: "POST", body: rows, prefer: "resolution=merge-duplicates,return=minimal"
  });
}
function sbFail(){ toast("Nincs internet, vagy a szerver nem elérhető — próbáld újra."); }
function roleToKey(role){
  if (role === "Vezető szerelő") return "vezeto";
  if (role === "Segéd szerelő") return "seged";
  return null;
}
function keyToRole(k){
  if (k === "vezeto") return "Vezető szerelő";
  if (k === "seged") return "Segéd szerelő";
  return "";
}

function loadState(afterOk){
  Promise.all([
    sb("settings?id=eq.1&select=*"),
    sb("daily_pay_rates?select=*"),
    sb("people?select=*"),
    sb("ajto_prices?select=*"),
    sb("catalog_items?select=*&order=sort_order"),
    sb("entries?deleted_at=is.null&select=*,entry_items(item_key,qty)"),
    sb("extras?deleted_at=is.null&select=*"),
    sb("month_locks?select=*")
  ]).then(function(r){
    var settings = (r[0] && r[0][0]) || { admin_pin:"1234", assembly_hourly_rate:0, kerites_utazas_hours:0, kerites_jarulekos_hours:0 };
    var dailyPay = { vacation:{vezeto:0,seged:0}, sick:{vezeto:0,seged:0} };
    (r[1]||[]).forEach(function(row){ if (dailyPay[row.day_type]) dailyPay[row.day_type][row.role] = row.amount; });

    var pricesByPerson = {};
    (r[3]||[]).forEach(function(row){
      if (!pricesByPerson[row.person_id]) pricesByPerson[row.person_id] = {};
      pricesByPerson[row.person_id][row.item_key] = row.price;
    });
    var people = (r[2]||[]).map(function(p){
      var out = { id:p.id, name:p.name, trade:p.trade, role:keyToRole(p.role), active:p.active };
      if (p.pin) out.pin = p.pin;
      if (p.trade === "ajto"){ out.travelFeePerDay = p.travel_fee_per_day||0; out.prices = pricesByPerson[p.id]||{}; }
      else { out.hourlyRate = p.hourly_rate||0; }
      return out;
    });

    var ajtoItems = [], keritesItems = [];
    (r[4]||[]).forEach(function(c){
      if (c.trade === "ajto") ajtoItems.push({ key:c.key, label:c.label, group:c.group_name });
      else {
        var it = { key:c.key, label:c.label, hoursPerUnit:c.hours_per_unit };
        if (c.is_override) it.override = true;
        keritesItems.push(it);
      }
    });
    var catalog = {
      ajto: { assemblyHourlyRate: settings.assembly_hourly_rate||0, items: ajtoItems },
      kerites: { fixedDailyHours: { utazas: settings.kerites_utazas_hours||0, jarulekos: settings.kerites_jarulekos_hours||0 }, items: keritesItems }
    };

    var entries = (r[5]||[]).map(function(row){
      var items = {};
      (row.entry_items||[]).forEach(function(ei){ items[ei.item_key] = ei.qty; });
      return {
        personId: row.person_id, date: row.date, trade: row.trade, dayType: row.day_type,
        items: items, orderRef: row.order_ref||"", assemblyHours: row.assembly_hours||0,
        bontasFestesOra: row.bontas_festes_ora||0, garanciaEgyebOra: row.garancia_egyeb_ora||0,
        workStart: row.work_start ? row.work_start.slice(0,5) : "", workEnd: row.work_end ? row.work_end.slice(0,5) : "",
        comment: row.comment||"", submittedAt: row.submitted_at, reviewedOk: row.reviewed_ok||false
      };
    });
    var extras = (r[6]||[]).map(function(row){ return { id:row.id, personId:row.person_id, month:row.month, label:row.label||"", amount:row.amount||0 }; });
    var monthLocks = (r[7]||[]).map(function(row){ return { trade:row.trade, month:row.month, locked:row.locked }; });

    STATE = { adminPin: settings.admin_pin, dailyPay: dailyPay, people: people, catalog: catalog, entries: entries, extras: extras, monthLocks: monthLocks };
    if (afterOk) afterOk();
  }).catch(function(err){
    console.error(err);
    if (afterOk) afterOk();
  });
}

function dbEntryRow(e){
  return {
    person_id: e.personId, date: e.date, trade: e.trade, day_type: e.dayType,
    order_ref: e.orderRef||"", assembly_hours: e.assemblyHours||0,
    bontas_festes_ora: e.bontasFestesOra||0, garancia_egyeb_ora: e.garanciaEgyebOra||0,
    work_start: e.workStart || null, work_end: e.workEnd || null,
    comment: e.comment||"", reviewed_ok: !!e.reviewedOk,
    submitted_at: e.submittedAt || new Date().toISOString(),
    deleted_at: null
  };
}
function saveEntries(entriesArr, afterOk){
  var rows = entriesArr.map(dbEntryRow);
  sb("entries?on_conflict=person_id,date", { method:"POST", body: rows, prefer:"resolution=merge-duplicates,return=representation" })
    .then(function(savedRows){
      var idByKey = {};
      (savedRows||[]).forEach(function(r){ idByKey[r.person_id+"|"+r.date] = r.id; });
      var entryIds = [];
      var itemRows = [];
      entriesArr.forEach(function(e){
        var id = idByKey[e.personId+"|"+e.date];
        if (!id) return;
        entryIds.push(id);
        Object.keys(e.items||{}).forEach(function(k){ if (e.items[k] > 0) itemRows.push({ entry_id:id, item_key:k, qty:e.items[k] }); });
      });
      var delP = entryIds.length ? sb("entry_items?entry_id=in.(" + entryIds.join(",") + ")", { method:"DELETE", prefer:"return=minimal" }) : Promise.resolve();
      return delP.then(function(){
        if (!itemRows.length) return;
        return sb("entry_items", { method:"POST", body:itemRows, prefer:"return=minimal" });
      });
    })
    .then(function(){ if (afterOk) afterOk(); })
    .catch(function(err){ console.error(err); sbFail(); });
}
function deleteEntry(personId, date, afterOk){
  sb("entries?person_id=eq."+encodeURIComponent(personId)+"&date=eq."+date, { method:"PATCH", body:{deleted_at:new Date().toISOString()}, prefer:"return=minimal" })
    .then(function(){ if (afterOk) afterOk(); })
    .catch(sbFail);
}

/* ---------- TOAST ---------- */
function toast(msg){
  var el = document.querySelector(".toast");
  if (el) el.remove();
  el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

/* ---------- RENDER ---------- */
function h(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }
function setRoot(html){ document.getElementById("root").innerHTML = html; }
function showConfirmModal(message, onConfirm, opts){
  opts = opts || {};
  var showOk = opts.showOk !== false;
  var cancelLabel = opts.cancelLabel || "Mégsem, javítom";
  var buttonsHtml = showOk
    ? '<button class="ghost" id="cm-cancel">'+escapeHtml(cancelLabel)+'</button><button class="primary" id="cm-ok">Jóváhagyom</button>'
    : '<button class="primary" id="cm-cancel">'+escapeHtml(cancelLabel)+'</button>';
  var badgeHtml = opts.badge ? '<div style="text-align:center"><span class="badge-stamp">'+escapeHtml(opts.badge)+'</span></div>' : '';
  var bg = h('<div class="modal-bg"><div class="modal">' +
    '<p style="white-space:pre-line;line-height:1.5;font-weight:600">'+escapeHtml(message)+'</p>' +
    badgeHtml +
    '<div style="display:flex;gap:.6rem;margin-top:1.2rem">' + buttonsHtml + '</div></div></div>');
  document.body.appendChild(bg);
  bg.querySelector("#cm-cancel").onclick = function(){ bg.remove(); if (opts.onCancel) opts.onCancel(); };
  if (showOk) bg.querySelector("#cm-ok").onclick = function(){ bg.remove(); onConfirm(); };
}

function renderEntry(){
  var person = getPerson(nav.personId);
  if (!person){ nav.view="landing"; return render(); }
  var date = nav.editDate || todayStr();
  var existing = entryFor(person.id, date) || { items:{}, comment:"", dayType:"work", orderRef:"", assemblyHours:0, bontasFestesOra:0, garanciaEgyebOra:0, workStart:"", workEnd:"" };
  var minDate = new Date(); minDate.setDate(1);
  var minDateStr = minDate.getFullYear()+"-"+pad(minDate.getMonth()+1)+"-"+pad(minDate.getDate());
  var locked = isLocked(person.trade, date.slice(0,7));

  var curMonth = todayStr().slice(0,7);
  var curMonthEntries = monthEntries(person.id, curMonth);
  var curMonthWd = curMonthEntries.filter(function(e){ return e.dayType==="work"; }).length;
  var curMonthVd = curMonthEntries.filter(function(e){ return e.dayType==="vacation"; }).length;
  var curMonthSd = curMonthEntries.filter(function(e){ return e.dayType==="sick"; }).length;
  var curMonthTopUp = 0;
  if (person.trade === "kerites"){
    curMonthEntries.forEach(function(e){ if (e.dayType==="work") curMonthTopUp += keritesHourBreakdown(e).topUp; });
  }
  var curMonthTotal = monthPieceTotal(person.id, curMonth) + monthExtrasTotal(person.id, curMonth);
  var monthSummaryHtml = '<div class="section-title"><h2>Ebben a hónapban</h2></div><div class="card">' +
    '<span class="l" style="color:var(--ink-muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.03em">Kereseted eddig ('+curMonth+')</span>' +
    '<div class="mono" style="font-size:1.7rem;font-weight:700;margin:.2rem 0 .6rem">'+fmtFt(curMonthTotal)+'</div>' +
    '<p class="muted">'+curMonthWd+' munkanap · '+curMonthVd+' szabadság · '+curMonthSd+' beteg'+(curMonthTopUp>0.001?' · '+curMonthTopUp.toFixed(1)+' óra pótlás':'')+'</p>' +
    '</div>';

  var catalog = STATE.catalog[person.trade];
  function counterRow(it){
    var q = existing.items[it.key] || 0;
    var priceLabel = person.trade==="ajto" ? fmtFt(person.prices[it.key]||0) : (it.hoursPerUnit + " óra/db");
    if (it.override){
      return '<div class="counter" data-key="'+it.key+'">' +
        '<div><span class="lbl">'+escapeHtml(it.label)+'</span><span class="price mono">'+priceLabel+'</span></div>' +
        '<input type="checkbox" class="override-check" data-check style="width:1.6rem;height:1.6rem"'+(q>0?" checked":"")+'>' +
        '</div>';
    }
    return '<div class="counter" data-key="'+it.key+'">' +
      '<div><span class="lbl">'+escapeHtml(it.label)+'</span><span class="price mono">'+priceLabel+'</span></div>' +
      '<div class="stepper"><button type="button" data-d="-1">–</button><input type="number" inputmode="numeric" class="qty mono" data-qty min="0" value="'+q+'"><button type="button" data-d="1">+</button></div>' +
      '</div>';
  }
  var itemsLabel = "Beépített tételek";
  var counters;
  if (person.trade === "ajto"){
    counters = groupAjtoItems(catalog.items).map(function(grp){
      return '<div class="item-group"><div class="item-group-title">'+escapeHtml(grp.label)+'</div>' +
        '<div class="counter-list">' + grp.items.map(counterRow).join("") + '</div></div>';
    }).join("");
    itemsLabel = "";
  } else {
    counters = '<div class="counter-list">' + catalog.items.map(counterRow).join("") + '</div>';
  }

  var extraFields = "";
  if (person.trade === "ajto"){
    extraFields = '<div class="field"><label>Összerakási idő (óra, ha volt)</label>' +
      '<input type="number" min="0" step="0.1" id="f-assembly" value="'+(existing.assemblyHours||0)+'"></div>';
  } else {
    extraFields = '<div class="row">' +
      '<div class="field"><label>Bontás / festés (óra)</label><input type="number" min="0" step="0.1" id="f-bontas" value="'+(existing.bontasFestesOra||0)+'"></div>' +
      '<div class="field"><label>Garancia / egyéb (óra)</label><input type="number" min="0" step="0.1" id="f-garancia" value="'+(existing.garanciaEgyebOra||0)+'"></div>' +
      '</div>';
  }

  var timeFields = "";
  if (person.trade === "kerites"){
    timeFields = '<div class="row">' +
      '<div class="field"><label>Munkakezdés</label><input type="time" id="f-work-start" value="'+escapeHtml(existing.workStart||"")+'"></div>' +
      '<div class="field"><label>Munkavég</label><input type="time" id="f-work-end" value="'+escapeHtml(existing.workEnd||"")+'"></div>' +
      '</div>';
  }

  var recent = STATE.entries.filter(function(e){ return e.personId===person.id; })
    .sort(function(a,b){ return b.date.localeCompare(a.date); }).slice(0,7);

  setRoot(
    headerHtml(person.name, "names") +
    '<main><div class="card">' +
    '<div class="field" id="f-date-field"><label>Dátum</label><input type="date" id="f-date" value="'+date+'" min="'+minDateStr+'" max="'+todayStr()+'"></div>' +
    (locked ? '<p class="pill warn">Ez a hónap már le van zárva — csak admin tud módosítani.</p>' : '') +
    '<div class="field"><label>Nap típusa</label><div class="day-type-group">' +
    '<button type="button" class="day-type-btn" data-daytype="work">Dolgozott</button>' +
    '<button type="button" class="day-type-btn" data-daytype="vacation">Szabadság</button>' +
    '<button type="button" class="day-type-btn" data-daytype="sick">Betegállomány</button>' +
    '</div></div>' +
    '<div id="work-fields">' +
    '<div class="field"><label>Munka / rendelés azonosító (opcionális)</label><input type="text" id="f-order" placeholder="pl. 1060/26" value="'+escapeHtml(existing.orderRef||"")+'"></div>' +
    timeFields +
    (itemsLabel ? '<label>'+itemsLabel+'</label>' : '') + counters +
    extraFields +
    '</div>' +
    '<div class="field" style="margin-top:.9rem"><label>Megjegyzés</label><textarea id="f-comment" placeholder="Bármi, amit jelezni szeretnél...">'+escapeHtml(existing.comment||"")+'</textarea></div>' +
    '<button class="primary" id="f-save"'+(locked?" disabled":"")+'>Mentés</button>' +
    '</div>' +
    (recent.length ? '<div class="section-title"><h2>Korábbi napjaid</h2></div><div class="card">' +
      recent.map(function(e){
        var val = calcEntryValue(e, person);
        var tag = e.dayType==="vacation" ? " · Szabadság" : (e.dayType==="sick" ? " · Betegállomány" : "");
        return '<div class="recent-item"><span>'+fmtDateFull(e.date)+tag+'</span>' +
          '<span><span class="mono">'+fmtFt(val)+'</span> ' +
          '<button class="link" data-edit="'+e.date+'">szerkeszt</button></span></div>';
      }).join("") + '</div>' : '') +
    monthSummaryHtml +
    '</main>'
  );

  var dayType = existing.dayType || "work";
  var anomalyChecked = false;
  function syncDayTypeUi(){
    document.querySelectorAll(".day-type-btn").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-daytype")===dayType);
    });
    document.getElementById("work-fields").style.display = dayType==="work" ? "" : "none";
  }
  syncDayTypeUi();
  document.querySelectorAll(".day-type-btn").forEach(function(b){
    b.onclick = function(){ dayType = b.getAttribute("data-daytype"); syncDayTypeUi(); };
  });

  document.querySelectorAll(".counter").forEach(function(row){
    var qtyEl = row.querySelector("[data-qty]");
    if (!qtyEl) return;
    row.querySelectorAll(".stepper button").forEach(function(btn){
      btn.onclick = function(){
        var v = (parseInt(qtyEl.value,10)||0) + parseInt(btn.getAttribute("data-d"),10);
        if (v<0) v=0;
        qtyEl.value = v;
      };
    });
    qtyEl.onchange = function(){
      var v = parseInt(qtyEl.value,10);
      if (isNaN(v) || v<0) v=0;
      qtyEl.value = v;
    };
  });

  document.querySelectorAll("[data-edit]").forEach(function(el){
    el.onclick = function(){
      nav.editDate = el.getAttribute("data-edit");
      render();
      window.scrollTo({ top:0, behavior:"smooth" });
      var dateField = document.getElementById("f-date-field");
      if (dateField){
        dateField.classList.remove("field-flash");
        void dateField.offsetWidth;
        dateField.classList.add("field-flash");
      }
    };
  });

  document.getElementById("f-date").onchange = function(){ nav.editDate = this.value; render(); };

  document.getElementById("f-save").onclick = function(){
    var d = document.getElementById("f-date").value;
    var entryLocked = isLocked(person.trade, d.slice(0,7));
    if (entryLocked){ toast("Ez a hónap le van zárva."); return; }
    if (!nav.adminAuthed && d < minDateStr){ toast("Ez a nap már egy korábbi hónapban van — szólj az adminnak, ha módosítani szeretnél rajta."); return; }
    if (person.trade==="kerites" && dayType==="work"){
      var ws = (document.getElementById("f-work-start")||{}).value;
      var we = (document.getElementById("f-work-end")||{}).value;
      if (!ws || !we){ toast("Add meg a munkakezdés és munkavég időpontját."); return; }
      if (timeToDecimal(we) <= timeToDecimal(ws)){ toast("A munkavégnek később kell lennie, mint a munkakezdésnek."); return; }
    }
    var items = {};
    document.querySelectorAll(".counter").forEach(function(row){
      var k = row.getAttribute("data-key");
      var checkEl = row.querySelector("[data-check]");
      var v = checkEl ? (checkEl.checked ? 1 : 0) : (parseInt(row.querySelector("[data-qty]").value,10)||0);
      if (v>0) items[k]=v;
    });
    var entry = {
      personId: person.id, date: d, trade: person.trade, dayType: dayType,
      items: items,
      orderRef: (document.getElementById("f-order")||{}).value || "",
      assemblyHours: person.trade==="ajto" ? (parseFloat((document.getElementById("f-assembly")||{}).value)||0) : 0,
      bontasFestesOra: person.trade==="kerites" ? (parseFloat((document.getElementById("f-bontas")||{}).value)||0) : 0,
      garanciaEgyebOra: person.trade==="kerites" ? (parseFloat((document.getElementById("f-garancia")||{}).value)||0) : 0,
      workStart: person.trade==="kerites" ? ((document.getElementById("f-work-start")||{}).value || "") : "",
      workEnd: person.trade==="kerites" ? ((document.getElementById("f-work-end")||{}).value || "") : "",
      comment: document.getElementById("f-comment").value,
      submittedAt: new Date().toISOString()
    };
    function doSave(){
      var idx = STATE.entries.findIndex(function(e){ return e.personId===person.id && e.date===entry.date; });
      if (idx>=0) STATE.entries[idx] = entry; else STATE.entries.push(entry);
      nav.editDate = null;
      saveEntries([entry], function(){ toast("Mentve! Köszi a munkát."); render(); });
    }

    if (isHourAnomaly(entry)){
      if (!anomalyChecked){
        showConfirmModal("Magas a mai napon a teljesítményed, ellenőriz a beírásokat!", null, {
          showOk: false,
          cancelLabel: "Vissza, ellenőrzöm",
          onCancel: function(){ anomalyChecked = true; }
        });
      } else {
        showConfirmModal("Ha tényleg ennyit szereltél, akkor hagyd jóvá és", doSave, {
          badge: "FASZÁK VAGYTOK SRÁCOK!"
        });
      }
      return;
    }
    doSave();
  };

  if (nav.justLoggedIn){
    nav.justLoggedIn = false;
    var missing = missingDaysThisMonth(person.id);
    if (missing.length){
      var missingListStr = missing.map(fmtDate).join(", ");
      showConfirmModal(
        "Hiányzó napjaid vannak ebben a hónapban:\n"+missingListStr+"\n\nKérlek, pótold őket, hogy naprakész legyen a naplód!",
        function(){},
        { showOk:false, cancelLabel:"Rendben" }
      );
    }
  }

  wireNav();
}

function renderAdminPin(){
  setRoot(
    headerHtml("Admin belépés", "landing") +
    '<main><div class="pin-wrap"><h1>PIN kód</h1><p class="muted">Add meg az admin PIN kódot.</p>' +
    '<div class="field" style="margin-top:1rem"><input type="text" inputmode="numeric" id="f-pin" maxlength="8" placeholder="••••"></div>' +
    '<button class="primary" id="f-pin-go">Belépés</button>' +
    '</div></main>'
  );
  document.getElementById("f-pin-go").onclick = function(){
    if (document.getElementById("f-pin").value === STATE.adminPin){
      nav.adminAuthed = true;
      try { sessionStorage.setItem("szn_admin","1"); } catch(e){}
      nav.view = "admin"; render();
    } else { toast("Helytelen PIN."); }
  };
  wireNav();
}

function renderAdmin(){
  if (!nav.adminAuthed){ nav.view="adminpin"; return render(); }
  var trade = nav.adminTrade, month = nav.adminMonth, tab = nav.adminTab || "overview";
  var people = STATE.people.filter(function(p){ return p.trade===trade; });
  var locked = isLocked(trade, month);
  var showMonthFilter = (tab==="overview" || tab==="payroll" || tab==="personMonth");

  var navItems = [
    { key:"overview", label:"📋 Napló mátrix" },
    { key:"payroll", label:"💰 Bérszámítás" },
    { key:"people", label:"👷 Szerelők" },
    { key:"pricing", label:"🏷️ Árazás" },
    { key:"settings", label:"⚙️ Beállítások" }
  ];
  var sidebar = '<div class="admin-sidebar">' + navItems.map(function(it){
    return '<button class="admin-nav-btn'+(tab===it.key?" active":"")+'" data-tab="'+it.key+'">'+it.label+'</button>';
  }).join("") + '</div>';

  var topbar = '<div class="admin-topbar">' +
    '<select id="a-trade"><option value="ajto"'+(trade==="ajto"?" selected":"")+'>Ajtó</option><option value="kerites"'+(trade==="kerites"?" selected":"")+'>Kerítés</option></select>' +
    (showMonthFilter ? '<input type="month" id="a-month" value="'+month+'">' : '') +
    '<span style="flex:1"></span>' +
    (showMonthFilter ? ((locked ? '<span class="pill warn">Hónap lezárva</span>' : '<span class="pill ok">Nyitott hónap</span>') +
      '<button class="ghost" id="a-lock">'+(locked?"Feloldás":"Hónap lezárása")+'</button>') : '') +
    '</div>';

  var personMonthPerson = tab==="personMonth" ? getPerson(nav.adminPersonId) : null;
  if (tab==="personMonth" && !personMonthPerson) tab = "overview";

  var content;
  if (tab==="overview") content = buildOverviewTab(people, trade, month);
  else if (tab==="payroll") content = buildPayrollTab(people, trade, month);
  else if (tab==="people") content = buildPeopleTab(people, trade);
  else if (tab==="pricing") content = buildPricingTab(people, trade);
  else if (tab==="personMonth") content = buildPersonMonthTab(personMonthPerson, month, locked);
  else content = buildSettingsTab();

  setRoot(
    headerHtml("Admin", "landing") +
    '<div class="admin-page"><div class="admin-body">' + sidebar +
    '<div class="admin-content">' + topbar + content + '</div>' +
    '</div></div>'
  );

  document.getElementById("a-trade").onchange = function(){ nav.adminTrade = this.value; nav.adminTab = "overview"; render(); };
  if (showMonthFilter){
    document.getElementById("a-month").onchange = function(){ nav.adminMonth = this.value; render(); };
    document.getElementById("a-lock").onclick = function(){
      var l = STATE.monthLocks.find(function(x){ return x.trade===trade && x.month===month; });
      var newLocked = l ? !l.locked : true;
      if (l) l.locked = newLocked; else STATE.monthLocks.push({ trade:trade, month:month, locked:newLocked });
      sbUpsert("month_locks", {trade:trade, month:month, locked:newLocked}, "trade,month")
        .then(function(){ render(); })
        .catch(sbFail);
    };
  }
  document.querySelectorAll(".admin-nav-btn").forEach(function(btn){
    btn.onclick = function(){ nav.adminTab = btn.getAttribute("data-tab"); render(); };
  });

  if (tab==="overview") wireOverviewTab(people, trade, month);
  else if (tab==="payroll") wirePayrollTab(people, trade, month);
  else if (tab==="people") wirePeopleTab(people, trade);
  else if (tab==="pricing") wirePricingTab(people, trade);
  else if (tab==="personMonth") wirePersonMonthTab(personMonthPerson, month, locked);
  else wireSettingsTab();

  wireNav();
}

function buildOverviewTab(people, trade, month){
  var dim = daysInMonth(month), today = todayStr();
  var worked=0, vac=0, sick=0, missing=0, anomaly=0;
  var matrixHead = '<th class="name-col">Szerelő</th>' +
    Array.from({length:dim},function(_,i){ return i+1; }).map(function(d){
      return '<th'+(weekday(month,d)===0||weekday(month,d)===6?' class="wknd"':'')+'>'+d+'</th>';
    }).join("");
  var matrixRows = people.map(function(p){
    var cells = Array.from({length:dim},function(_,i){ return i+1; }).map(function(d){
      var dateStr = month+"-"+pad(d);
      var wknd = weekday(month,d)===0||weekday(month,d)===6;
      var e = entryFor(p.id, dateStr);
      var mark = "", cls = "cell" + (wknd?" wknd":"");
      if (e){
        if (e.dayType==="vacation"){ mark='<span title="Szabadság">✈</span>'; vac++; }
        else if (e.dayType==="sick"){ mark='<span style="color:var(--sick)" title="Betegállomány">✚</span>'; sick++; }
        else if (isHourAnomaly(e) && !e.reviewedOk){ mark='<span style="color:var(--flag)" title="Magas teljesítmény — ellenőrizd!">⚠</span>'; worked++; anomaly++; }
        else { mark='<span style="color:var(--ok)" title="Rögzítve">●</span>'; worked++; }
      }
      else if (dateStr <= today && !wknd) { mark = '<span style="color:var(--warn)" title="Hiányzik">·</span>'; missing++; }
      return '<td class="'+cls+'" data-person="'+p.id+'" data-date="'+dateStr+'">'+mark+'</td>';
    }).join("");
    return '<tr><td class="name-col"><button type="button" class="link" data-open-person="'+p.id+'">'+escapeHtml(p.name)+'</button></td>'+cells+'</tr>';
  }).join("");

  return '<h1 class="admin-h1">Napló mátrix</h1><p class="muted" style="margin-bottom:1.2rem">Kattints egy napra a részletekért, vagy egy szerelő nevére a havi táblázatért.</p>' +
    '<div class="stat-row">' +
    '<div class="stat-tile"><span class="n mono" style="color:var(--ok)">'+worked+'</span><span class="l">Rögzített nap</span></div>' +
    '<div class="stat-tile"><span class="n mono" style="color:var(--info)">'+vac+'</span><span class="l">Szabadság</span></div>' +
    '<div class="stat-tile"><span class="n mono" style="color:var(--sick)">'+sick+'</span><span class="l">Betegállomány</span></div>' +
    '<div class="stat-tile"><span class="n mono" style="color:var(--warn)">'+missing+'</span><span class="l">Hiányzó nap</span></div>' +
    (trade==="kerites" ? '<div class="stat-tile"><span class="n mono" style="color:var(--flag)">'+anomaly+'</span><span class="l">Magas teljesítmény</span></div>' : '') +
    '</div>' +
    '<div class="matrix-scroll"><table class="matrix"><thead><tr>'+matrixHead+'</tr></thead><tbody>'+matrixRows+'</tbody></table></div>' +
    '<p class="muted" style="margin-top:.6rem;font-size:.8rem">● rögzítve · ✈ szabadság · ✚ betegállomány · · hiányzik (hétköznap, nincs bejegyzés)'+(trade==="kerites"?' · ⚠ magas teljesítmény — ellenőrizendő':'')+'</p>';
}
function wireOverviewTab(people, trade, month){
  document.querySelectorAll(".matrix td.cell").forEach(function(td){
    td.onclick = function(){ openEntryModal(td.getAttribute("data-person"), td.getAttribute("data-date")); };
  });
  document.querySelectorAll("[data-open-person]").forEach(function(btn){
    btn.onclick = function(){ nav.adminPersonId = btn.getAttribute("data-open-person"); nav.adminTab = "personMonth"; render(); };
  });
}

function buildPersonMonthTab(person, month, locked){
  var dim = daysInMonth(month);
  var trade = person.trade;
  var isAjto = trade === "ajto";
  var items = isAjto
    ? groupAjtoItems(STATE.catalog.ajto.items).reduce(function(acc,g){ return acc.concat(g.items); }, [])
    : STATE.catalog.kerites.items;

  function itemColLabel(it){
    return escapeHtml(it.label) + (isAjto ? "" : '<br><span class="muted" style="font-weight:400;font-size:.68rem">'+it.hoursPerUnit+' óra/db</span>');
  }

  var groupHeaderRow = "";
  if (isAjto){
    var groups = groupAjtoItems(STATE.catalog.ajto.items);
    var trailingCount = 1 + 2; // Összerakás + Megjegyzés + Érték
    groupHeaderRow = '<tr><th colspan="2"></th>' + groups.map(function(g){
      return '<th colspan="'+g.items.length+'" style="text-align:center;background:var(--surface-2)">'+escapeHtml(g.label)+'</th>';
    }).join("") + '<th colspan="'+trailingCount+'"></th></tr>';
  }
  var itemHeadCells = items.map(function(it){ return '<th>'+itemColLabel(it)+'</th>'; }).join("");
  var extraHeadCells = isAjto
    ? '<th>Összerakás<br><span class="muted" style="font-weight:400;font-size:.68rem">óra</span></th>'
    : '<th>Kezdés</th><th>Vég</th><th>Bontás/<br>festés</th><th>Garancia/<br>egyéb</th>';

  var rows = "";
  for (var d=1; d<=dim; d++){
    var dateStr = month+"-"+pad(d);
    var e = entryFor(person.id, dateStr);
    var dt = e ? e.dayType : "";
    var wknd = weekday(month,d)===0 || weekday(month,d)===6;

    var itemCells = items.map(function(it){
      var q = (e && e.items && e.items[it.key]) || 0;
      if (it.override){
        return '<td><input type="checkbox" data-pm-item="'+it.key+'" style="width:1.2rem;height:1.2rem"'+(q>0?" checked":"")+(locked?" disabled":"")+'></td>';
      }
      return '<td><input type="number" min="0" data-pm-item="'+it.key+'" value="'+q+'"'+(locked?" disabled":"")+'></td>';
    }).join("");

    var extraCells = isAjto
      ? '<td><input type="number" min="0" step="0.1" data-pm-field="assemblyHours" value="'+((e&&e.assemblyHours)||0)+'"'+(locked?" disabled":"")+'></td>'
      : '<td><input type="time" data-pm-field="workStart" value="'+escapeHtml((e&&e.workStart)||"")+'"'+(locked?" disabled":"")+'></td>' +
        '<td><input type="time" data-pm-field="workEnd" value="'+escapeHtml((e&&e.workEnd)||"")+'"'+(locked?" disabled":"")+'></td>' +
        '<td><input type="number" min="0" step="0.1" data-pm-field="bontasFestesOra" value="'+((e&&e.bontasFestesOra)||0)+'"'+(locked?" disabled":"")+'></td>' +
        '<td><input type="number" min="0" step="0.1" data-pm-field="garanciaEgyebOra" value="'+((e&&e.garanciaEgyebOra)||0)+'"'+(locked?" disabled":"")+'></td>';

    var val = e ? calcEntryValue(e, person) : 0;
    var flagged = e && isHourAnomaly(e) && !e.reviewedOk;
    var rowCls = flagged ? "flagrow" : (wknd ? "wknd" : "");

    rows += '<tr data-date="'+dateStr+'"'+(rowCls?' class="'+rowCls+'"':'')+'>' +
      '<td class="name-col">'+(flagged?'<span style="color:var(--flag)" title="Magas teljesítmény — ellenőrizd!">⚠ </span>':'')+d+'.</td>' +
      '<td><select data-pm-daytype'+(locked?" disabled":"")+'>' +
        '<option value=""'+(dt===""?" selected":"")+'>—</option>' +
        '<option value="work"'+(dt==="work"?" selected":"")+'>Dolgozott</option>' +
        '<option value="vacation"'+(dt==="vacation"?" selected":"")+'>Szabadság</option>' +
        '<option value="sick"'+(dt==="sick"?" selected":"")+'>Betegállomány</option>' +
      '</select></td>' +
      itemCells + extraCells +
      '<td><input type="text" data-pm-field="comment" value="'+escapeHtml((e&&e.comment)||"")+'"'+(locked?" disabled":"")+'></td>' +
      '<td class="mono">'+fmtFt(val)+'</td>' +
      '</tr>';
  }

  return '<button class="ghost" id="pm-back" style="margin-bottom:1rem">← Vissza a Napló mátrixhoz</button>' +
    '<h1 class="admin-h1">'+escapeHtml(person.name)+' — '+month+'</h1>' +
    (locked ? '<p class="pill warn" style="margin-bottom:1rem">Ez a hónap le van zárva — csak a feloldás után szerkeszthető.</p>' : '') +

function wirePersonMonthTab(person, month, locked){
  document.getElementById("pm-back").onclick = function(){ nav.adminTab = "overview"; render(); };
  if (locked){ wireNav(); return; }
  document.getElementById("pm-save").onclick = function(){
    var trade = person.trade;
    var toSave = [];
    document.querySelectorAll("tr[data-date]").forEach(function(row){
      var dateStr = row.getAttribute("data-date");
      var dayType = row.querySelector("[data-pm-daytype]").value;
      var items = {};
      row.querySelectorAll("[data-pm-item]").forEach(function(inp){
        var key = inp.getAttribute("data-pm-item");
        var v = inp.type === "checkbox" ? (inp.checked ? 1 : 0) : (parseFloat(inp.value)||0);
        if (v>0) items[key] = v;
      });
      var fields = {};
      row.querySelectorAll("[data-pm-field]").forEach(function(inp){
        fields[inp.getAttribute("data-pm-field")] = inp.value;
      });
      var hasItems = Object.keys(items).length > 0;
      var hasHours = trade==="ajto"
        ? (parseFloat(fields.assemblyHours)||0) > 0
        : ((parseFloat(fields.bontasFestesOra)||0) > 0 || (parseFloat(fields.garanciaEgyebOra)||0) > 0 || !!fields.workStart || !!fields.workEnd);
      var hasComment = fields.comment && fields.comment.trim() !== "";
      var existing = entryFor(person.id, dateStr);
      var meaningful = dayType !== "" || hasItems || hasHours || hasComment;
      if (!existing && !meaningful) return;

      var entry = {
        personId: person.id, date: dateStr, trade: trade,
        dayType: dayType || "work",
        items: items,
        orderRef: existing ? (existing.orderRef||"") : "",
        assemblyHours: trade==="ajto" ? (parseFloat(fields.assemblyHours)||0) : 0,
        bontasFestesOra: trade==="kerites" ? (parseFloat(fields.bontasFestesOra)||0) : 0,
        garanciaEgyebOra: trade==="kerites" ? (parseFloat(fields.garanciaEgyebOra)||0) : 0,
        workStart: trade==="kerites" ? (fields.workStart||"") : "",
        workEnd: trade==="kerites" ? (fields.workEnd||"") : "",
        comment: fields.comment || "",
        submittedAt: new Date().toISOString()
      };
      toSave.push(entry);
    });
    toSave.forEach(function(entry){
      var idx = STATE.entries.findIndex(function(x){ return x.personId===person.id && x.date===entry.date; });
      if (idx>=0) STATE.entries[idx] = entry; else STATE.entries.push(entry);
    });
    if (!toSave.length){ toast("Nincs menteni való változás."); return; }
    saveEntries(toSave, function(){ toast("Havi táblázat mentve."); render(); });
  };
  wireNav();
}

function buildPayrollTab(people, trade, month){
  var grand = 0;
  var rows = people.map(function(p){
    var piece = monthPieceTotal(p.id, month);
    var extras = STATE.extras.filter(function(x){ return x.personId===p.id && x.month===month; });
    var extrasTotal = extras.reduce(function(s,x){ return s+(x.amount||0); },0);
    var wd = monthEntries(p.id, month).filter(function(e){ return e.dayType==="work"; }).length;
    var vd = monthEntries(p.id, month).filter(function(e){ return e.dayType==="vacation"; }).length;
    var sd = monthEntries(p.id, month).filter(function(e){ return e.dayType==="sick"; }).length;
    var topUpHours = 0;
    if (trade === "kerites"){
      monthEntries(p.id, month).forEach(function(e){
        if (e.dayType==="work") topUpHours += keritesHourBreakdown(e).topUp;
      });
    }
    grand += piece + extrasTotal;
    return '<tr><td><strong>'+escapeHtml(p.name)+'</strong><div class="muted" style="font-size:.76rem">'+wd+' munkanap · '+vd+' szabadság · '+sd+' beteg'+(topUpHours>0.001?' · '+topUpHours.toFixed(1)+' óra pótlás':'')+'</div></td>' +
      '<td class="mono">'+fmtFt(piece)+'</td>' +
      '<td><div class="extras-list" data-person="'+p.id+'">' +
        extras.map(function(x){
          return '<div class="extra-row"><input type="text" value="'+escapeHtml(x.label)+'" data-extra-label="'+x.id+'">' +
            '<input type="number" value="'+x.amount+'" data-extra-amount="'+x.id+'">' +
            '<button class="small-btn danger" data-extra-del="'+x.id+'">✕</button></div>';
        }).join("") +
        '<button class="small-btn" data-extra-add="'+p.id+'">+ Tétel</button>' +
      '</div></td>' +
      '<td class="mono"><strong>'+fmtFt(piece+extrasTotal)+'</strong></td>' +
      '</tr>';
  }).join("");
  return '<h1 class="admin-h1">Bérszámítás — '+month+'</h1>' +
    '<div class="stat-row"><div class="stat-tile"><span class="n mono">'+fmtFt(grand)+'</span><span class="l">Havi összesen ('+(trade==="ajto"?"ajtó":"kerítés")+')</span></div></div>' +
    '<div class="matrix-scroll"><table class="summary-table"><thead><tr><th>Szerelő</th><th>Teljesítmény</th><th>Extra tételek</th><th>Végösszeg</th></tr></thead>' +
    '<tbody>'+rows+'</tbody>' +
    '<tfoot><tr><td>Összesen</td><td></td><td></td><td class="mono">'+fmtFt(grand)+'</td></tr></tfoot></table></div>';
}

      '<div>'+ (rows || '<p class="muted">Nincs tétel.</p>') + '</div>' +
      (person.trade==="ajto" && e.assemblyHours ? '<div class="recent-item"><span>Összerakás</span><span class="mono">'+e.assemblyHours+' óra</span></div>' : '') +
      (person.trade==="kerites" && (e.bontasFestesOra||e.garanciaEgyebOra) ? '<div class="recent-item"><span>Bontás/festés + garancia</span><span class="mono">'+((e.bontasFestesOra||0)+(e.garanciaEgyebOra||0))+' óra</span></div>' : '') +
      (person.trade==="kerites" ? keritesHoursInfoHtml(e) : '') +
      '<div class="recent-item"><strong>Érték</strong><strong class="mono">'+fmtFt(calcEntryValue(e,person))+'</strong></div>' +
      (e.comment ? '<p style="margin-top:.6rem">"'+escapeHtml(e.comment)+'"</p>' : '');
  }
  var showReview = e && isHourAnomaly(e);
  var bg = h('<div class="modal-bg"><div class="modal"><h3>'+escapeHtml(person.name)+' — '+fmtDate(date)+'</h3><div style="margin-top:.7rem">'+body+'</div>' +
    '<div style="display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap"><button class="ghost" id="m-close">Bezár</button>' +
    (e ? '<button class="ghost" id="m-edit">Szerkesztés</button><button class="ghost danger" id="m-del">Törlés</button>' : '') +
    (showReview ? '<button class="ghost" id="m-review">'+(e.reviewedOk ? "Ellenőrzés visszavonása" : "Ellenőrizve, rendben")+'</button>' : '') +
    '</div></div></div>');
  document.body.appendChild(bg);
  bg.addEventListener("click", function(ev){ if (ev.target===bg) bg.remove(); });
  bg.querySelector("#m-close").onclick = function(){ bg.remove(); };
  if (e){
    bg.querySelector("#m-edit").onclick = function(){
      bg.remove();
      nav.view = "entry"; nav.personId = personId; nav.editDate = date;
      render();
    };
    bg.querySelector("#m-del").onclick = function(){
      if (!confirm("Biztosan törlöd ezt a bejegyzést?")) return;
      STATE.entries = STATE.entries.filter(function(x){ return !(x.personId===personId && x.date===date); });
      bg.remove();
      deleteEntry(personId, date, function(){ render(); });
    };
  }
  if (showReview){
    bg.querySelector("#m-review").onclick = function(){
      e.reviewedOk = !e.reviewedOk;
      bg.remove();
      sb("entries?person_id=eq."+encodeURIComponent(personId)+"&date=eq."+date, { method:"PATCH", body:{reviewed_ok:e.reviewedOk}, prefer:"return=minimal" })
        .then(function(){ render(); })
        .catch(sbFail);
    };
  }
}

function wireNav(){
  document.querySelectorAll("[data-nav]").forEach(function(el){
    el.onclick = function(ev){
      ev.preventDefault();
      var target = el.getAttribute("data-nav");
      if (target === "landing"){ nav.view="landing"; nav.trade=null; nav.personId=null; }
      else if (target === "names"){ nav.view="names"; }
      else if (target === "adminpin"){ nav.view="adminpin"; }
      render();
    };
  });
}

render();
loadState(function(){ render(); });
})();
</script>

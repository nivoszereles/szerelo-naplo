/* ---------- HELPERS ---------- */
function pad(n){ return n<10 ? "0"+n : ""+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function monthStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function daysInMonth(ym){ var parts=ym.split("-"); return new Date(parseInt(parts[0]),parseInt(parts[1]),0).getDate(); }
function monthRange(startMonth, count){
  var parts = startMonth.split("-");
  var y = parseInt(parts[0],10), m = parseInt(parts[1],10)-1;
  var out = [];
  for (var i=0;i<count;i++){
    out.push(monthStr(new Date(y, m+i, 1)));
  }
  return out;
}
function fmtFt(n){ return Math.round(n).toLocaleString("hu-HU")+" Ft"; }
function fmtDate(iso){ var p=iso.split("-"); return p[2]+"."+p[1]+"."; }
function fmtDateFull(iso){ var p=iso.split("-"); return p[0]+"."+p[1]+"."+p[2]+"."; }
function diffDays(a,b){ return Math.round((new Date(a)-new Date(b))/86400000); }
function weekday(ym,day){ return new Date(parseInt(ym.split("-")[0]),parseInt(ym.split("-")[1])-1,day).getDay(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function smoothScrollToTop(duration){
  duration = duration || 450;
  var startY = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop;
  if (startY <= 0) return;
  if (document.hidden){ window.scrollTo(0,0); return; }
  var startTime = null;
  function easeOutQuad(t){ return t * (2 - t); }
  function step(ts){
    if (startTime === null) startTime = ts;
    var elapsed = ts - startTime;
    var progress = Math.min(elapsed / duration, 1);
    var y = startY * (1 - easeOutQuad(progress));
    window.scrollTo(0, y);
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function getPerson(id){ return STATE.people.find(function(p){ return p.id===id; }); }
function isLocked(trade,month){ return STATE.monthLocks.some(function(l){ return l.trade===trade && l.month===month && l.locked; }); }
function minEditableDateStr(trade){
  var curMonthStart = new Date(); curMonthStart.setDate(1);
  var prevMonthStart = new Date(curMonthStart); prevMonthStart.setMonth(prevMonthStart.getMonth()-1);
  var prevMonth = prevMonthStart.getFullYear()+"-"+pad(prevMonthStart.getMonth()+1);
  if (!isLocked(trade, prevMonth)){
    return prevMonth+"-01";
  }
  return curMonthStart.getFullYear()+"-"+pad(curMonthStart.getMonth()+1)+"-01";
}
function entryFor(personId,date){ return STATE.entries.find(function(e){ return e.personId===personId && e.date===date; }); }
function missingDaysThisMonth(personId){
  var today = todayStr();
  var month = today.slice(0,7);
  var dim = daysInMonth(month);
  var missing = [];
  for (var d=1; d<=dim; d++){
    var dateStr = month+"-"+pad(d);
    if (dateStr >= today) break;
    var wknd = weekday(month,d)===0 || weekday(month,d)===6;
    if (wknd) continue;
    if (!entryFor(personId, dateStr)) missing.push(dateStr);
  }
  return missing;
}
function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function parseJobId(text, fallbackYear){
  if (!text) return null;
  var m = text.match(/(\d+)(?:\s*\/\s*(\d{2,4}))?/);
  if (!m) return null;
  var number = parseInt(m[1], 10);
  var year;
  if (m[2]) year = m[2].length===2 ? (2000+parseInt(m[2],10)) : parseInt(m[2],10);
  else year = fallbackYear;
  return { year: year, number: number, key: year+"-"+number };
}
function parseAllJobIds(text, fallbackYear){
  if (!text) return [];
  var matches = text.match(/\d+(?:\s*\/\s*\d{2,4})?/g);
  if (!matches) return [];
  var seen = {}, out = [];
  matches.forEach(function(m){
    var mm = m.match(/(\d+)(?:\s*\/\s*(\d{2,4}))?/);
    var number = parseInt(mm[1],10);
    var year = mm[2] ? (mm[2].length===2 ? 2000+parseInt(mm[2],10) : parseInt(mm[2],10)) : fallbackYear;
    var key = year+"-"+number;
    if (seen[key]) return;
    seen[key] = true;
    out.push({ year:year, number:number, key:key });
  });
  return out;
}
function computeKeritesJobStatuses(){
  var entriesByJob = {};
  STATE.entries.forEach(function(e){
    if (e.trade !== "kerites" || e.dayType !== "work") return;
    var entryYear = parseInt(e.date.slice(0,4), 10);
    var jobIds = parseAllJobIds(e.orderRef, entryYear);
    jobIds.forEach(function(parsed){
      if (!entriesByJob[parsed.key]) entriesByJob[parsed.key] = [];
      entriesByJob[parsed.key].push(e);
    });
  });
  var jobs = {};
  Object.keys(entriesByJob).forEach(function(key){
    var list = entriesByJob[key].slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
    var last = list[list.length-1];
    jobs[key] = { status: last.addressStatus || null, lastDate: last.date };
  });
  return jobs;
}

var AJTO_GROUP_ORDER = ["ajto","epulet","kiegeszito"];
var AJTO_GROUP_LABELS = { ajto: "Ajtó típusok", epulet: "Épület típusok", kiegeszito: "Kiegészítők" };
function groupAjtoItems(items){
  var buckets = {};
  items.forEach(function(it){
    var g = it.group || "kiegeszito";
    if (!buckets[g]) buckets[g] = [];
    buckets[g].push(it);
  });
  return AJTO_GROUP_ORDER.filter(function(g){ return buckets[g] && buckets[g].length; })
    .map(function(g){ return { key:g, label:AJTO_GROUP_LABELS[g], items:buckets[g] }; });
}
function ajtoItemsByGroup(groupKey){
  return STATE.catalog.ajto.items.filter(function(it){ return (it.group||"kiegeszito")===groupKey; });
}
function ajtoItemLabel(key){
  var it = STATE.catalog.ajto.items.find(function(x){ return x.key===key; });
  return it ? it.label : key;
}

function roleKey(role){
  if (role === "Vezető szerelő") return "vezeto";
  if (role === "Segéd szerelő") return "seged";
  return null;
}

function timeToDecimal(t){
  if (!t) return null;
  var parts = t.split(":");
  if (parts.length<2) return null;
  var h = parseInt(parts[0],10), m = parseInt(parts[1],10);
  if (isNaN(h) || isNaN(m)) return null;
  return h + m/60;
}
function workedHoursOf(entry){
  var s = timeToDecimal(entry.workStart), e = timeToDecimal(entry.workEnd);
  if (s==null || e==null) return null;
  var diff = e - s;
  return diff>0 ? diff : null;
}
var AJTO_OVERTIME_THRESHOLD_HOURS = 9;
function ajtoOvertimeHours(entry){
  var h = workedHoursOf(entry);
  if (h==null) return 0;
  var ot = h - AJTO_OVERTIME_THRESHOLD_HOURS;
  return ot>0 ? ot : 0;
}
function ajtoOvertimeRate(person){
  var rk = roleKey(person.role);
  return rk ? (STATE.catalog.ajto.overtimeRates[rk]||0) : 0;
}
function ajtoOvertimePay(entry, person){
  return ajtoOvertimeHours(entry) * ajtoOvertimeRate(person);
}
function ajtoRepairRate(person){
  var rk = roleKey(person.role);
  return rk ? (STATE.catalog.ajto.repairRates[rk]||0) : 0;
}
function ajtoRepairPay(entry, person){
  return (workedHoursOf(entry)||0) * ajtoRepairRate(person);
}
function keritesOverrideItem(entry){
  var kitems = STATE.catalog.kerites.items;
  for (var i=0;i<kitems.length;i++){
    if (kitems[i].override && entry.items && entry.items[kitems[i].key] > 0) return kitems[i];
  }
  return null;
}
var KERITES_CREW_ADJUST_CUTOFF = "2026-10-01";
var KERITES_PROBLEM_TYPES = ["Felmérési hiba", "Gyártási hiba", "Hiányzó alkatrész", "Szerelői hiba", "Ügyfél hibás előkészület", "Egyéb"];
var AJTO_PROBLEM_TYPES = ["Felmérési hiba", "Gyártási hiba", "Hiányzó alkatrész", "Hibás méretű fém mobil takaró", "Szerelői hiba", "Ügyfél hibás előkészület", "Egyéb"];
var METAL_COVER_PROBLEM_TYPE = "Hibás méretű fém mobil takaró";
var METAL_COVER_NAMES = ["Bal oldali takaró", "Felső takaró", "Jobb oldali takaró"];
var AJTO_TEAM_COLORS = ["Kék", "Piros", "Zöld", "Fekete", "Narancs"];
function blankMetalCovers(){

function ajtoEntryHasProblem(e){
  if (e.doorLines && e.doorLines.length) return e.doorLines.some(function(l){ return l.status==="problem"; });
  return e.addressStatus==="problem";
}
function ajtoEntryHasFailed(e){
  return !!(e.doorLines && e.doorLines.length && e.doorLines.some(function(l){ return l.status==="failed"; }));
}
function keritesHourBreakdown(entry){
  var perf, overrideItem = keritesOverrideItem(entry);
  if (overrideItem){
    perf = overrideItem.hoursPerUnit;
  } else {
    var kitems = STATE.catalog.kerites.items, unitHours = 0;
    for (var j=0;j<kitems.length;j++){
      var qk = (entry.items && entry.items[kitems[j].key]) || 0;
      unitHours += qk * kitems[j].hoursPerUnit;
    }
    if (STATE.keritesCrewAdjust && entry.date >= KERITES_CREW_ADJUST_CUTOFF){
      var crew = keritesActualCrewSize(entry) || 2;
      if (crew >= 3) unitHours = unitHours * (2/crew);
    }
    var fixed = unitHours>0 ? (STATE.catalog.kerites.fixedDailyHours.utazas + STATE.catalog.kerites.fixedDailyHours.jarulekos) : 0;
    perf = unitHours + fixed;
  }
  var clocked = workedHoursOf(entry);
  var topUp = (clocked!=null && clocked>perf) ? (clocked-perf) : 0;
  return { perf: perf, clocked: clocked, topUp: topUp, overrideItem: overrideItem };
}
function simulateKeritesPerf(items, crewSize, dateVal){
  var kitems = STATE.catalog.kerites.items;
  var overrideItem = null;
  for (var i=0;i<kitems.length;i++){
    if (kitems[i].override && items[kitems[i].key] > 0){ overrideItem = kitems[i]; break; }
  }
  if (overrideItem) return { perf: overrideItem.hoursPerUnit, overrideLabel: overrideItem.label, crewAdjustApplied:false };
  var unitHours = 0;
  kitems.forEach(function(it){ unitHours += (items[it.key]||0) * it.hoursPerUnit; });
  var crewAdjustApplied = false;
  if (STATE.keritesCrewAdjust && dateVal >= KERITES_CREW_ADJUST_CUTOFF && crewSize >= 3){
    unitHours = unitHours * (2/crewSize);
    crewAdjustApplied = true;
  }
  var fixed = unitHours>0 ? (STATE.catalog.kerites.fixedDailyHours.utazas + STATE.catalog.kerites.fixedDailyHours.jarulekos) : 0;
  return { perf: unitHours + fixed, overrideLabel: null, crewAdjustApplied: crewAdjustApplied };
}
function isHourAnomaly(entry){
  if (!entry || entry.trade!=="kerites" || entry.dayType!=="work") return false;
  var b = keritesHourBreakdown(entry);
  if (b.overrideItem) return false;
  return b.clocked!=null && b.perf > b.clocked * 1.2;
}
function keritesHoursInfoHtml(entry){
  if (entry.dayType !== "work") return "";
  var b = keritesHourBreakdown(entry);
  var html = b.overrideItem
    ? '<div class="recent-item"><span>Teljesítmény óra</span><span class="mono">'+b.perf.toFixed(1)+' óra ('+escapeHtml(b.overrideItem.label)+' — fix)</span></div>'
    : '<div class="recent-item"><span>Teljesítmény óra</span><span class="mono">'+b.perf.toFixed(1)+' óra</span></div>';
  if (b.clocked!=null){
    html += '<div class="recent-item"><span>Ledolgozott idő</span><span class="mono">'+entry.workStart+'–'+entry.workEnd+' ('+b.clocked.toFixed(1)+' óra)</span></div>';
    if (b.topUp > 0.001){
      html += '<div class="recent-item"><span>Órabéres pótlás</span><span class="mono">+'+b.topUp.toFixed(1)+' óra</span></div>';
    }
  } else {
    html += '<p class="muted" style="font-size:.8rem">Nincs rögzítve munkaidő ehhez a naphoz.</p>';
  }
  return html;
}

function calcEntryValue(entry, person){
  if (!entry) return 0;
  if (isVacationDayType(entry.dayType) || entry.dayType === "sick"){
    var rk = roleKey(person.role);
    if (!rk) return 0;
    var payDayType = isVacationDayType(entry.dayType) ? "vacation" : entry.dayType;
    var table = STATE.dailyPay && STATE.dailyPay[payDayType];
    return (table && table[rk]) || 0;
  }
  if (entry.dayType !== "work") return 0;
  if (person.trade === "ajto") {
    if (entry.repairDay) return ajtoRepairPay(entry, person);
    var items = STATE.catalog.ajto.items, itemsTotal = 0, anyQty = false;
    for (var i=0;i<items.length;i++){
      var q = (entry.items && entry.items[items[i].key]) || 0;
      if (q>0) anyQty = true;
      itemsTotal += q * (person.prices[items[i].key]||0);
    }
    if (!anyQty && entry.doorLines && entry.doorLines.length) anyQty = true;
    var travel = anyQty ? (person.travelFeePerDay||0) : 0;
    var overtime = ajtoOvertimePay(entry, person);
    return itemsTotal + travel + overtime;
  } else {
    var b = keritesHourBreakdown(entry);
    var payHours = b.clocked!=null ? Math.max(b.perf, b.clocked) : b.perf;
    return payHours * (person.hourlyRate||0);
  }
}

/* ---------- Kerítés: létszámmal korrigált, munka-szintű bérszámítás (kísérleti, kikapcsolható) ---------- */
function jobIdsShareKey(idsA, idsB){
  return idsA.some(function(a){ return idsB.some(function(b){ return a.key===b.key; }); });
}
function keritesActualCrewSize(entry){
  var entryYear = parseInt(entry.date.slice(0,4),10);
  var myJobs = parseAllJobIds(entry.orderRef, entryYear);
  if (!myJobs.length) return entry.crewSize || null;
  var ids = {};
  STATE.entries.forEach(function(e){
    if (e.trade!=="kerites" || e.dayType!=="work" || e.date!==entry.date) return;
    var otherJobs = parseAllJobIds(e.orderRef, entryYear);
    if (jobIdsShareKey(myJobs, otherJobs)) ids[e.personId]=true;
  });
  var n = Object.keys(ids).length;
  return n>0 ? n : (entry.crewSize || null);
}
function keritesCrewPreviewText(orderRefVal, dateVal, myPersonId){
  if (!orderRefVal || !orderRefVal.trim() || !dateVal) return "";
  var entryYear = parseInt(dateVal.slice(0,4),10);
  var myJobs = parseAllJobIds(orderRefVal, entryYear);
  if (!myJobs.length) return "";
  var ids = {};
  STATE.entries.forEach(function(e){
    if (e.trade!=="kerites" || e.dayType!=="work" || e.date!==dateVal || e.personId===myPersonId) return;
    var otherJobs = parseAllJobIds(e.orderRef, entryYear);
    if (jobIdsShareKey(myJobs, otherJobs)) ids[e.personId]=true;
  });
  var otherNames = Object.keys(ids).map(function(id){ var p=getPerson(id); return p?p.name:id; });
  if (!otherNames.length) return "Jelenleg te vagy az egyetlen rögzített szerelő erre a napra, erre a rendelésszámra.";
  var total = otherNames.length + 1;
  return "Jelenleg "+otherNames.length+" másik szerelő is rögzítve van erre a napra, erre a rendelésszámra ("+otherNames.join(", ")+") — a rendszer "+total+" fős csapatként veszi figyelembe.";
}
function monthPieceTotalKeritesNew(personId, month){
  var person = getPerson(personId);
  var allEntries = monthEntries(personId, month);
  var total = 0, byJob = {};
  allEntries.forEach(function(e){

    if (b.clocked!=null){ byJob[parsed.key].clocked += b.clocked; byJob[parsed.key].anyClocked = true; }

function computeKeritesCrewMismatches(month){
  var mismatches = [];
  STATE.entries.forEach(function(e){
    if (e.trade!=="kerites" || e.dayType!=="work" || e.date.slice(0,7)!==month) return;
    if (!e.crewSize) return;
    var actual = keritesActualCrewSize(e);
    if (actual && actual > e.crewSize){
      var entryYear = parseInt(e.date.slice(0,4),10);
      var myJobs = parseAllJobIds(e.orderRef, entryYear);
      var others = [];
      STATE.entries.forEach(function(o){
        if (o.trade!=="kerites" || o.dayType!=="work" || o.date!==e.date || o.personId===e.personId) return;
        var otherJobs = parseAllJobIds(o.orderRef, entryYear);
        if (jobIdsShareKey(myJobs, otherJobs)) others.push(o.personId);
      });
      mismatches.push({ personId:e.personId, date:e.date, orderRef:e.orderRef, declared:e.crewSize, actual:actual, otherIds:others });
    }
  });
  mismatches.sort(function(a,b){ return a.date.localeCompare(b.date); });
  return mismatches;
}

function sb(path, opts){
  opts = opts || {};
  var headers = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY };
  if (opts.body) headers["Content-Type"] = "application/json";
  if (opts.prefer) headers["Prefer"] = opts.prefer;
  return fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){ throw new Error(t); });
    if (r.status === 204) return null;
    return r.text().then(function(t){ return t ? JSON.parse(t) : null; });
  });
}
function sbUpsert(table, rows, conflictCols){
  return sb(table + "?on_conflict=" + conflictCols, {
    method: "POST", body: rows, prefer: "resolution=merge-duplicates,return=minimal"
  });
}

function compressImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      var cw = Math.max(1, Math.round(img.width * scale));
      var ch = Math.max(1, Math.round(img.height * scale));
      var canvas = document.createElement("canvas");
      canvas.width = cw; canvas.height = ch;
      canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
      URL.revokeObjectURL(url);
      canvas.toBlob(function(blob){
        if (blob) resolve(blob); else reject(new Error("compress failed"));
      }, "image/jpeg", quality);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("image load failed")); };
    img.src = url;
  });
}

function saveEntries(entriesArr, afterOk){
  var rows = entriesArr.map(dbEntryRow);
  sb("entries?on_conflict=person_id,date", { method:"POST", body: rows, prefer:"resolution=merge-duplicates,return=representation" })
    .then(function(savedRows){
      var idByKey = {};
      (savedRows||[]).forEach(function(r){ idByKey[r.person_id+"|"+r.date] = r.id; });
      var entryIds = [];
      var itemRows = [];
      entriesArr.forEach(function(e){
        var id = idByKey[e.personId+"|"+e.date];
        if (!id) return;
        entryIds.push(id);
        Object.keys(e.items||{}).forEach(function(k){ if (e.items[k] > 0) itemRows.push({ entry_id:id, item_key:k, qty:e.items[k] }); });
      });
      var delP = entryIds.length ? sb("entry_items?entry_id=in.(" + entryIds.join(",") + ")", { method:"DELETE", prefer:"return=minimal" }) : Promise.resolve();
      return delP.then(function(){
        if (!itemRows.length) return;
        return sb("entry_items", { method:"POST", body:itemRows, prefer:"return=minimal" });
      });
    })
    .then(function(){ if (afterOk) afterOk(); })
    .catch(function(err){ console.error(err); sbFail(); });
}

function renderEntry(){

    (curMonthBonusEligible

    function finishSave(){ toast("Mentve! Köszi a munkát."); render(); }
    function syncEntryPhotos(){
      sb("entries?person_id=eq."+encodeURIComponent(person.id)+"&date=eq."+entry.date+"&select=id").then(function(rows){
        var entryId = rows && rows[0] && rows[0].id;
        if (!entryId){ finishSave(); return; }
        var ops = [];
        removedPhotoIds.forEach(function(pid){
          var p = existingPhotos.filter(function(x){ return String(x.id)===String(pid); })[0];
          if (p) ops.push(deleteEntryPhoto(p));
        });
        pendingPhotos.forEach(function(p){ ops.push(uploadEntryPhoto(entryId, p.blob)); });
        if (ajtoDoorLinesMode){
          doorLines.forEach(function(l){
            l._photos.removed.forEach(function(pid){
              var p = l._photos.existing.filter(function(x){ return String(x.id)===String(pid); })[0];
              if (p) ops.push(deleteEntryPhoto(p));
            });
            l._photos.pending.forEach(function(p){ ops.push(uploadEntryPhoto(entryId, p.blob, l.lineId)); });
          });
        }
        Promise.all(ops).then(finishSave).catch(function(){
          toast("Mentve, de a fotók feltöltésekor hiba történt.");
          render();
        });
      }).catch(finishSave);
    }
    function doSave(){
      var idx = STATE.entries.findIndex(function(e){ return e.personId===person.id && e.date===entry.date; });
      if (idx>=0) STATE.entries[idx] = entry; else STATE.entries.push(entry);
      nav.editDate = null;
      var prevFailedIds = {};
      (existing.doorLines||[]).forEach(function(l){ if (l.status==="failed") prevFailedIds[l.lineId]=true; });
      var newlyFailed = (ajtoDoorLinesMode && entry.doorLines) ? entry.doorLines.filter(function(l){ return l.status==="failed" && !prevFailedIds[l.lineId]; }) : [];
      saveEntries([entry], function(){
        var hasLinePhotoChanges = ajtoDoorLinesMode && doorLines.some(function(l){ return l._photos.pending.length || l._photos.removed.length; });
        if (newlyFailed.length) notifyFailedInstallations(newlyFailed, person, entry.date);
        if ((photosEnabled && (pendingPhotos.length || removedPhotoIds.length)) || hasLinePhotoChanges) syncEntryPhotos();
        else finishSave();
      });
    }

    if (isHourAnomaly(entry)){
      if (!anomalyChecked){
        showConfirmModal("Magas a mai napon a teljesítményed, ellenőriz a beírásokat!", null, {
          showOk: false,
          cancelLabel: "Vissza, ellenőrzöm",
          onCancel: function(){ anomalyChecked = true; }
        });
      } else {
        showConfirmModal("Ha tényleg ennyit szereltél, akkor hagyd jóvá és", doSave, {
          badge: "FASZÁK VAGYTOK SRÁCOK!"
        });
      }
      return;
    }
    doSave();
  };

  if (nav.justLoggedIn){
    nav.justLoggedIn = false;
    var missing = missingDaysThisMonth(person.id);
    if (missing.length){

      showConfirmModal(

        function(){},
        { showOk:false, cancelLabel:"Rendben" }
      );
    }
  }

  wireNav();
}

function prevMonthStr(ym){
  var parts = ym.split("-");
  var y = parseInt(parts[0],10), m = parseInt(parts[1],10)-1;
  return monthStr(new Date(y, m-1, 1));
}
function monthTotalForTrade(trade, month){
  var people = STATE.people.filter(function(p){ return p.trade===trade && p.active!==false; });
  var total = 0;
  people.forEach(function(p){
    total += monthPieceTotalEffective(p.id, month, trade) + monthExtrasTotal(p.id, month) + monthAttendanceBonus(p.id, month);
  });
  return total;
}
function monthToDateSimpleTotal(trade, month, throughDay){
  var people = STATE.people.filter(function(p){ return p.trade===trade && p.active!==false; });
  var total = 0;
  people.forEach(function(p){
    monthEntries(p.id, month).forEach(function(e){
      if (parseInt(e.date.slice(8,10),10) <= throughDay) total += calcEntryValue(e, p);
    });
  });
  return total;
}
function computeDashboardStats(month){
  var today = todayStr();
  var dim = daysInMonth(month);
  var missing = 0, anomaly = 0;
  STATE.people.filter(function(p){ return p.active!==false; }).forEach(function(p){
    for (var d=1; d<=dim; d++){
      var dateStr = month+"-"+pad(d);
      if (dateStr > today) break;
      if (weekday(month,d)===0 || weekday(month,d)===6) continue;
      if (!entryFor(p.id, dateStr)) missing++;
    }
  });
  STATE.entries.forEach(function(e){
    if (e.trade!=="kerites" || e.dayType!=="work" || e.date.slice(0,7)!==month) return;
    if (isHourAnomaly(e) && !e.reviewedOk) anomaly++;
  });
  var jobStatuses = computeKeritesJobStatuses();
  var openProblemAddr = 0;
  Object.keys(jobStatuses).forEach(function(k){
    if (jobStatuses[k].status==="continue" || jobStatuses[k].status==="problem") openProblemAddr++;
  });
  var ajtoProblem = 0;
  STATE.entries.forEach(function(e){
    if (e.trade!=="ajto" || e.dayType!=="work" || e.date.slice(0,7)!==month) return;
    if (ajtoEntryHasProblem(e)) ajtoProblem++;
  });
  return { missing: missing, anomaly: anomaly, openProblemAddr: openProblemAddr, crewMismatches: computeKeritesCrewMismatches(month).length, ajtoProblem: ajtoProblem };
}
function dashboardTrendHtml(cur, prev){
  if (prev <= 0) return '<p class="muted" style="font-size:.74rem;margin:.3rem 0 0">Nincs előző havi adat</p>';
  var diff = cur - prev;
  var pct = Math.round((diff/prev)*100);
  var arrow = diff>=0 ? "▲" : "▼";
  var sign = diff>=0 ? "+" : "";
  return '<p class="muted" style="font-size:.74rem;margin:.3rem 0 0">'+arrow+' '+sign+fmtFt(diff)+' ('+sign+pct+'%) időarányosan az előző hónaphoz képest</p>';
}
function buildDashboardTab(){
  var month = todayStr().slice(0,7);
  var prevMonth = prevMonthStr(month);
  var stats = computeDashboardStats(month);
  var ajtoTotal = monthTotalForTrade("ajto", month);
  var keritesTotal = monthTotalForTrade("kerites", month);
  var togetherTotal = ajtoTotal + keritesTotal;

  var todayDay = parseInt(todayStr().slice(8,10),10);
  var prevCutoffDay = Math.max(1, Math.round((todayDay / daysInMonth(month)) * daysInMonth(prevMonth)));
  var ajtoCurSimple = monthToDateSimpleTotal("ajto", month, todayDay);
  var ajtoPrevSimple = monthToDateSimpleTotal("ajto", prevMonth, prevCutoffDay);
  var keritesCurSimple = monthToDateSimpleTotal("kerites", month, todayDay);
  var keritesPrevSimple = monthToDateSimpleTotal("kerites", prevMonth, prevCutoffDay);

function buildOverviewTab(people, trade, month){
  var dim = daysInMonth(month), today = todayStr();
  var worked=0, vac=0, vacPlanned=0, vacUnplanned=0, sick=0, missing=0, anomaly=0, ajtoProblem=0, ajtoFailed=0;
  var jobStatuses = trade==="kerites" ? computeKeritesJobStatuses() : {};
  var openAddrCount = 0, problemAddrCount = 0;
  if (trade==="kerites"){
    Object.keys(jobStatuses).forEach(function(k){
      if (jobStatuses[k].status==="continue") openAddrCount++;
      else if (jobStatuses[k].status==="problem") problemAddrCount++;
    });
  }
  var matrixHead = '<th class="name-col">Szerelő</th>' +
    Array.from({length:dim},function(_,i){ return i+1; }).map(function(d){
      return '<th'+(weekday(month,d)===0||weekday(month,d)===6?' class="wknd"':'')+'>'+d+'</th>';
    }).join("");
  var multidayInfo = {};
  if (trade==="kerites"){
    people.forEach(function(p){
      var byKey = {};
      for (var d=1; d<=dim; d++){
        var dateStr = month+"-"+pad(d);
        var e = entryFor(p.id, dateStr);
        if (!e || e.dayType!=="work") continue;
        var jobIds = parseAllJobIds(e.orderRef, parseInt(e.date.slice(0,4),10));
        jobIds.forEach(function(parsed){
          if (!byKey[parsed.key]) byKey[parsed.key] = [];
          if (byKey[parsed.key].indexOf(dateStr)===-1) byKey[parsed.key].push(dateStr);
        });
      }
      var info = {};
      Object.keys(byKey).forEach(function(key){
        var dates = byKey[key];
        if (dates.length < 2) return;
        dates.forEach(function(dateStr, idx){ info[dateStr] = { pos: idx+1, total: dates.length }; });
      });
      multidayInfo[p.id] = info;
    });
  }
  var matrixRows = people.map(function(p){
    var cells = Array.from({length:dim},function(_,i){ return i+1; }).map(function(d){
      var dateStr = month+"-"+pad(d);
      var wknd = weekday(month,d)===0||weekday(month,d)===6;
      var e = entryFor(p.id, dateStr);
      var mark = "", cls = "cell" + (wknd?" wknd":"");
      if (e){
        if (e.dayType==="vacation"){ mark='<span style="color:var(--info)" title="Tervezett szabadság">✈</span>'; vac++; vacPlanned++; }
        else if (e.dayType===DAYTYPE_VACATION_UNPLANNED){ mark='<span style="color:var(--warn)" title="Nem tervezett szabadság">✈</span>'; vac++; vacUnplanned++; }
        else if (e.dayType==="sick"){ mark='<span style="color:var(--sick)" title="Betegállomány">✚</span>'; sick++; }
        else {
          var jobStatus = null;
          if (trade==="kerites"){
            var eJobIds = parseAllJobIds(e.orderRef, parseInt(e.date.slice(0,4),10));
            for (var ji=0; ji<eJobIds.length; ji++){
              var js = jobStatuses[eJobIds[ji].key];
              if (js && js.status==="done"){ jobStatus = "done"; break; }
              if (js) jobStatus = js.status;
            }
          }
          if (trade==="kerites" && jobStatus==="done" && e.addressStatus!=="done"){ mark='<span style="color:var(--ok)" title="Rögzítve — a cím időközben befejeződött">●</span>'; worked++; }
          else if (trade==="kerites" && e.addressStatus==="problem"){ mark='<span style="color:var(--flag)" title="Probléma merült fel, megakadt a szerelés">✕</span>'; worked++; }
          else if (trade==="kerites" && e.addressStatus==="continue"){ mark='<span style="color:var(--warn)" title="Folytatni kell a címet">↻</span>'; worked++; }
          else if (trade==="ajto" && ajtoEntryHasProblem(e)){ mark='<span style="color:var(--flag)" title="Probléma merült fel, vissza kell menni">✕</span>'; worked++; ajtoProblem++; }
          else if (trade==="ajto" && ajtoEntryHasFailed(e)){ mark='<span style="color:var(--warn)" title="Meghiúsult beépítés">⊘</span>'; worked++; ajtoFailed++; }
          else if (isHourAnomaly(e) && !e.reviewedOk){ mark='<span style="color:var(--flag)" title="Magas teljesítmény — ellenőrizd!">⚠</span>'; worked++; anomaly++; }
          else { mark='<span style="color:var(--ok)" title="Rögzítve">●</span>'; worked++; }
          var mdInfo = multidayInfo[p.id] && multidayInfo[p.id][dateStr];
          if (mdInfo){
            cls += " multiday";
            mark += '<span class="md-badge" title="Ugyanaz a cím '+mdInfo.total+' napig tartott ebben a hónapban — ez a '+mdInfo.pos+'. nap">'+mdInfo.pos+'/'+mdInfo.total+'</span>';
          }
        }
      }
      else if (dateStr <= today && !wknd) { mark = '<span style="color:var(--warn)" title="Hiányzik">·</span>'; missing++; }
      return '<td class="'+cls+'" data-person="'+p.id+'" data-date="'+dateStr+'">'+mark+'</td>';
    }).join("");
    return '<tr><td class="name-col"><button type="button" class="link" data-open-person="'+p.id+'">'+escapeHtml(p.name)+'</button></td>'+cells+'</tr>';
  }).join("");

  return '<h1 class="admin-h1">Napló mátrix</h1><p class="muted" style="margin-bottom:1.2rem">Kattints egy napra a részletekért, vagy egy szerelő nevére a havi táblázatért.</p>' +
    '<div class="stat-row">' +
    '<div class="stat-tile"><span class="n mono" style="color:var(--ok)">'+worked+'</span><span class="l">Rögzített nap</span></div>' +
    '<div class="stat-tile"><span class="n mono" style="color:var(--info)">'+vac+'</span><span class="l">Szabadság</span>'+(trade==="ajto"?'<p class="muted" style="font-size:.68rem;margin-top:.2rem">'+vacPlanned+' tervezett · '+vacUnplanned+' nem tervezett</p>':'')+'</div>' +
    '<div class="stat-tile"><span class="n mono" style="color:var(--sick)">'+sick+'</span><span class="l">Betegállomány</span></div>' +
    '<div class="stat-tile"><span class="n mono" style="color:var(--warn)">'+missing+'</span><span class="l">Hiányzó nap</span></div>' +
    (trade==="kerites" ? '<div class="stat-tile"><span class="n mono" style="color:var(--flag)">'+anomaly+'</span><span class="l">Magas teljesítmény</span></div>' : '') +
    (trade==="kerites" ? '<div class="stat-tile"><span class="n mono" style="color:var(--warn)">'+openAddrCount+'</span><span class="l">Címre vissza kell menni</span></div>' : '') +
    (trade==="kerites" ? '<div class="stat-tile"><span class="n mono" style="color:var(--flag)">'+problemAddrCount+'</span><span class="l">Problémás cím</span></div>' : '') +
    (trade==="ajto" ? '<div class="stat-tile"><span class="n mono" style="color:var(--flag)">'+ajtoProblem+'</span><span class="l">Problémás nap</span></div>' : '') +
    (trade==="ajto" ? '<div class="stat-tile"><span class="n mono" style="color:var(--warn)">'+ajtoFailed+'</span><span class="l">Meghiúsult beépítés</span></div>' : '') +
    '</div>' +
    '<div class="matrix-scroll"><table class="matrix"><thead><tr>'+matrixHead+'</tr></thead><tbody>'+matrixRows+'</tbody></table></div>' +
    '<p class="muted" style="margin-top:.6rem;font-size:.8rem">● rögzítve · ✈ szabadság · ✚ betegállomány · · hiányzik (hétköznap, nincs bejegyzés)'+(trade==="kerites"?' · ⚠ magas teljesítmény — ellenőrizendő · ↻ folytatni kell a címet · ✕ probléma, megakadt a szerelés · kék felső keret + "2/4" jelvény: ugyanaz a cím több napig tartott ebben a hónapban':'')+(trade==="ajto"?' · ✕ probléma merült fel, vissza kell menni · ⊘ meghiúsult beépítés · kék ✈ = tervezett szabadság, sárga ✈ = nem tervezett szabadság':'')+'</p>';
}

function buildAddressesTab(year){
  var unidentified = [];
  var jobs = {};

  STATE.entries.forEach(function(e){
    if (e.trade !== "kerites" || e.dayType !== "work") return;
    var entryYear = parseInt(e.date.slice(0,4), 10);
    if (entryYear !== year) return;
    var allJobIds = parseAllJobIds(e.orderRef, entryYear);
    if (!allJobIds.length){ unidentified.push(e); return; }
    var jobIds = allJobIds.filter(function(j){ return j.year===year; });
    if (!jobIds.length) return;
    jobIds.forEach(function(parsed){
      if (!jobs[parsed.key]) jobs[parsed.key] = { year: parsed.year, number: parsed.number, entries: [] };
      jobs[parsed.key].entries.push(e);
    });
  });

  var jobList = Object.keys(jobs).map(function(k){ return jobs[k]; });
  jobList.forEach(function(j){
    j.entries.sort(function(a,b){ return a.date.localeCompare(b.date); });
    j.firstDate = j.entries[0].date;
    j.lastDate = j.entries[j.entries.length-1].date;
    j.dayCount = j.entries.length;
    var installerIds = [];
    j.entries.forEach(function(e){ if (installerIds.indexOf(e.personId)===-1) installerIds.push(e.personId); });
    j.installerNames = installerIds.map(function(id){ var p=getPerson(id); return p?p.name:id; });
    j.totalHours = 0;
    j.entries.forEach(function(e){ var b = keritesHourBreakdown(e); j.totalHours += (b.clocked!=null ? Math.max(b.perf,b.clocked) : b.perf); });
    j.lastStatus = j.entries[j.entries.length-1].addressStatus || null;
    j.problemComments = j.entries.filter(function(e){ return e.addressStatus==="problem"; }).map(function(e){ return { date:e.date, comment:e.comment }; });
  });

  jobList.sort(function(a,b){
    var aLive = a.lastStatus==="continue" || a.lastStatus==="problem";
    var bLive = b.lastStatus==="continue" || b.lastStatus==="problem";
    if (aLive !== bLive) return aLive ? -1 : 1;
    return b.lastDate.localeCompare(a.lastDate);
  });
  var liveJobs = jobList.filter(function(j){ return j.lastStatus==="continue" || j.lastStatus==="problem"; });
  var doneJobs = jobList.filter(function(j){ return !(j.lastStatus==="continue" || j.lastStatus==="problem"); });

  function jobRowHtml(j){
    var statusPill = j.lastStatus==="problem" ? '<span class="pill flag">Probléma</span>'
      : j.lastStatus==="continue" ? '<span class="pill warn">Folytatni kell</span>'
      : j.lastStatus==="done" ? '<span class="pill ok">Kész</span>' : '<span class="pill info">—</span>';
    return '<div style="padding:.7rem 0;border-bottom:1px solid var(--line)">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:.6rem">' +
      '<strong>#'+j.number+' ('+j.year+')</strong>' + statusPill +
      '</div>' +
      '<div class="muted" style="font-size:.8rem;margin-top:.2rem">'+fmtDateFull(j.firstDate)+' – '+fmtDateFull(j.lastDate)+' · '+j.dayCount+' nap · '+j.totalHours.toFixed(1)+' óra · '+j.installerNames.map(escapeHtml).join(", ")+'</div>' +
      (j.problemComments.length ? '<div style="font-size:.8rem;color:var(--flag);margin-top:.3rem">'+j.problemComments.map(function(c){ return escapeHtml(fmtDate(c.date))+': "'+escapeHtml(c.comment||"")+'"'; }).join('<br>')+'</div>' : '') +
      '</div>';
  }

  var liveHtml = liveJobs.length ? liveJobs.map(jobRowHtml).join("") : '<p class="muted">Nincs jelenleg folytatásra váró vagy problémás cím.</p>';
  var doneHtml = doneJobs.length ? doneJobs.map(jobRowHtml).join("") : '<p class="muted">Nincs lezárt cím ebben az évben.</p>';
  var unidentifiedHtml = unidentified.map(function(e){
    var p = getPerson(e.personId);
    return '<div class="recent-item"><span>'+fmtDateFull(e.date)+' · '+escapeHtml(p?p.name:e.personId)+'</span><span class="mono">"'+escapeHtml(e.orderRef||"")+'"</span></div>';
  }).join("");

  return '<h1 class="admin-h1">Címek — '+year+'</h1>' +
    '<p class="muted" style="margin-bottom:1.2rem">A szerelők által beírt munka/rendelés azonosítók száma alapján összefűzött címek.</p>' +
    '<div class="section-title"><h2>Élő címek (folytatásra vár / probléma)</h2></div><div class="card">'+liveHtml+'</div>' +
    '<div class="section-title"><h2>Lezárt címek</h2></div><div class="card">'+doneHtml+'</div>' +
    (unidentified.length ? '<div class="section-title"><h2>Azonosítatlan bejegyzések (régi, számot nem tartalmazó adat)</h2></div><div class="card">'+unidentifiedHtml+'</div>' : '');
}

function buildPersonMonthTab(person, month, locked){
  var dim = daysInMonth(month);
  var trade = person.trade;
  var isAjto = trade === "ajto";
  var items = isAjto
    ? groupAjtoItems(STATE.catalog.ajto.items).reduce(function(acc,g){ return acc.concat(g.items); }, [])
    : STATE.catalog.kerites.items;

  function itemColLabel(it){
    return escapeHtml(it.label) + (isAjto ? "" : '<br><span class="muted" style="font-weight:400;font-size:.68rem">'+it.hoursPerUnit+' óra/db</span>');
  }

  var groupHeaderRow = "";
  if (isAjto){
    var groups = groupAjtoItems(STATE.catalog.ajto.items);
    var trailingCount = 6 + 2; // Javítás + Túlóra + Kezdés + Vég + Csapatszín + Probléma + Megjegyzés + Érték
    groupHeaderRow = '<tr><th colspan="2"></th>' + groups.map(function(g){
      return '<th colspan="'+g.items.length+'" style="text-align:center;background:var(--surface-2)">'+escapeHtml(g.label)+'</th>';
    }).join("") + '<th colspan="'+trailingCount+'"></th></tr>';
  }
  var itemHeadCells = items.map(function(it){ return '<th>'+itemColLabel(it)+'</th>'; }).join("");
  var extraHeadCells = isAjto
    ? '<th>Javítás<br><span class="muted" style="font-weight:400;font-size:.68rem">egész napos</span></th><th>Túlóra<br><span class="muted" style="font-weight:400;font-size:.68rem">9 óra fölött</span></th><th>Kezdés</th><th>Vég</th><th>Csapatszín</th><th>Probléma</th>'
    : '<th>Kezdés</th><th>Vég</th><th>Bontás/<br>festés</th><th>Garancia/<br>egyéb</th>';

  var rows = "";
  for (var d=1; d<=dim; d++){
    var dateStr = month+"-"+pad(d);
    var e = entryFor(person.id, dateStr);
    var dt = e ? e.dayType : "";
    var wknd = weekday(month,d)===0 || weekday(month,d)===6;

    var itemCells = items.map(function(it){
      var q = (e && e.items && e.items[it.key]) || 0;
      if (it.override){
        return '<td><input type="checkbox" data-pm-item="'+it.key+'" style="width:1.2rem;height:1.2rem"'+(q>0?" checked":"")+(locked?" disabled":"")+'></td>';
      }
      return '<td><input type="number" min="0" data-pm-item="'+it.key+'" value="'+q+'"'+(locked?" disabled":"")+'></td>';
    }).join("");

    var otHours = (e && person.trade==="ajto" && !e.repairDay) ? ajtoOvertimeHours(e) : 0;
    var otPay = (e && person.trade==="ajto" && !e.repairDay) ? ajtoOvertimePay(e, person) : 0;
    var extraCells = isAjto
      ? '<td style="text-align:center"><input type="checkbox" data-pm-field="repairDay" style="width:1.2rem;height:1.2rem"'+(e&&e.repairDay?" checked":"")+(locked?" disabled":"")+'></td>' +
        '<td class="mono" style="text-align:center">'+(e && e.repairDay ? fmtFt(ajtoRepairPay(e,person)) : (otHours>0 ? otHours.toFixed(2)+' ó<br>'+fmtFt(otPay) : '—'))+'</td>' +
        '<td><input type="time" data-pm-field="workStart" value="'+escapeHtml((e&&e.workStart)||"")+'"'+(locked?" disabled":"")+'></td>' +
        '<td><input type="time" data-pm-field="workEnd" value="'+escapeHtml((e&&e.workEnd)||"")+'"'+(locked?" disabled":"")+'></td>' +
        '<td><select data-pm-field="teamColor"'+(locked?" disabled":"")+'>' +
          '<option value="">—</option>' +
          AJTO_TEAM_COLORS.map(function(c){ return '<option value="'+escapeHtml(c)+'"'+(e&&e.teamColor===c?" selected":"")+'>'+escapeHtml(c)+'</option>'; }).join("") +
        '</select></td>' +
        '<td class="mono" style="text-align:center">'+(e && ajtoEntryHasProblem(e) ? '<span style="color:var(--flag)" title="Van probléma ezen a napon — részletek a Napló mátrixban">✕</span>' : '')+(e && ajtoEntryHasFailed(e) ? '<span style="color:var(--warn)" title="Meghiúsult beépítés ezen a napon — részletek a Napló mátrixban">⊘</span>' : '')+'</td>'
      : '<td><input type="time" data-pm-field="workStart" value="'+escapeHtml((e&&e.workStart)||"")+'"'+(locked?" disabled":"")+'></td>' +
        '<td><input type="time" data-pm-field="workEnd" value="'+escapeHtml((e&&e.workEnd)||"")+'"'+(locked?" disabled":"")+'></td>' +
        '<td><input type="number" min="0" step="0.1" data-pm-field="bontasFestesOra" value="'+((e&&e.bontasFestesOra)||0)+'"'+(locked?" disabled":"")+'></td>' +

    var val = e ? calcEntryValue(e, person) : 0;
    var flagged = e && isHourAnomaly(e) && !e.reviewedOk;
    var rowCls = flagged ? "flagrow" : (wknd ? "wknd" : "");

    rows += '<tr data-date="'+dateStr+'"'+(rowCls?' class="'+rowCls+'"':'')+'>' +
      '<td class="name-col">'+(flagged?'<span style="color:var(--flag)" title="Magas teljesítmény — ellenőrizd!">⚠ </span>':'')+d+'.</td>' +

          '<option value="'+DAYTYPE_VACATION_UNPLANNED+'"'+(dt===DAYTYPE_VACATION_UNPLANNED?" selected":"")+'>Nem tervezett szabadság</option>'
        ) : '<option value="vacation"'+(dt==="vacation"?" selected":"")+'>Szabadság</option>') +

      '</select></td>' +
      itemCells + extraCells +
      '<td><input type="text" data-pm-field="comment" value="'+escapeHtml((e&&e.comment)||"")+'"'+(locked?" disabled":"")+'></td>' +
      '<td class="mono">'+fmtFt(val)+'</td>' +
      '</tr>';
  }

  return '<button class="ghost" id="pm-back" style="margin-bottom:1rem">← Vissza a Napló mátrixhoz</button>' +
    '<h1 class="admin-h1">'+escapeHtml(person.name)+' — '+month+'</h1>' +
    (locked ? '<p class="pill warn" style="margin-bottom:1rem">Ez a hónap le van zárva — csak a feloldás után szerkeszthető.</p>' : '') +
    '<div class="matrix-scroll"><table class="matrix pm-table">' +
    '<thead>' + groupHeaderRow +
    '<tr><th class="name-col">Nap</th><th>Típus</th>' + itemHeadCells + extraHeadCells + '<th>Megjegyzés</th><th>Érték</th></tr>' +
    '</thead><tbody>' + rows + '</tbody></table></div>' +
    (locked ? '' : '<button class="primary" id="pm-save" style="margin-top:1rem;max-width:220px">Mentés</button>');

      var dayType = row.querySelector("[data-pm-daytype]").value;
      var items = {};
      row.querySelectorAll("[data-pm-item]").forEach(function(inp){
        var key = inp.getAttribute("data-pm-item");
        var v = inp.type === "checkbox" ? (inp.checked ? 1 : 0) : (parseFloat(inp.value)||0);
        if (v>0) items[key] = v;
      });
      var fields = {};
      row.querySelectorAll("[data-pm-field]").forEach(function(inp){
        var key = inp.getAttribute("data-pm-field");
        fields[key] = inp.type === "checkbox" ? inp.checked : inp.value;
      });
      var hasItems = Object.keys(items).length > 0;
      var hasHours = trade==="ajto"
        ? (!!fields.workStart || !!fields.workEnd || !!fields.teamColor || !!fields.repairDay)
        : ((parseFloat(fields.bontasFestesOra)||0) > 0 || (parseFloat(fields.garanciaEgyebOra)||0) > 0 || !!fields.workStart || !!fields.workEnd);
      var hasComment = fields.comment && fields.comment.trim() !== "";
      var existing = entryFor(person.id, dateStr);
      var meaningful = dayType !== "" || hasItems || hasHours || hasComment;
      if (!existing && !meaningful) return;

      var entry = {
        personId: person.id, date: dateStr, trade: trade,
        dayType: dayType || "work",
        items: items,
        orderRef: existing ? (existing.orderRef||"") : "",
        assemblyHours: 0,
        repairDay: trade==="ajto" ? !!fields.repairDay : false,
        bontasFestesOra: trade==="kerites" ? (parseFloat(fields.bontasFestesOra)||0) : 0,
        garanciaEgyebOra: trade==="kerites" ? (parseFloat(fields.garanciaEgyebOra)||0) : 0,
        workStart: (trade==="kerites" || trade==="ajto") ? (fields.workStart||"") : "",
        workEnd: (trade==="kerites" || trade==="ajto") ? (fields.workEnd||"") : "",
        comment: fields.comment || "",
        addressStatus: existing ? (existing.addressStatus||null) : null,
        crewSize: existing ? (existing.crewSize||null) : null,
        problemType: existing ? (existing.problemType||null) : null,
        doorLines: existing ? (existing.doorLines||null) : null,
        metalCoverSizes: existing ? (existing.metalCoverSizes||null) : null,
        teamColor: trade==="ajto" ? (fields.teamColor||null) : null,
        submittedAt: new Date().toISOString()
      };
      toSave.push(entry);
    });
    toSave.forEach(function(entry){
      var idx = STATE.entries.findIndex(function(x){ return x.personId===person.id && x.date===entry.date; });
      if (idx>=0) STATE.entries[idx] = entry; else STATE.entries.push(entry);
    });
    if (!toSave.length){ toast("Nincs menteni való változás."); return; }
    saveEntries(toSave, function(){ toast("Havi táblázat mentve."); render(); });
  };
  wireNav();
}

function buildPayrollTab(people, trade, month){

  var rows = people.map(function(p){
    var piece = monthPieceTotal(p.id, month);
    var pieceNew = showCompare ? monthPieceTotalKeritesNew(p.id, month) : piece;
    var workPiece = monthWorkPieceTotal(p.id, month);
    var workPieceNew = showCompare ? monthWorkPieceTotalKeritesNew(p.id, month) : workPiece;
    var vacSickPay = monthVacSickPayTotal(p.id, month);
    grandVacSick += vacSickPay;
    var extras = STATE.extras.filter(function(x){ return x.personId===p.id && x.month===month; });
    var extrasTotal = extras.reduce(function(s,x){ return s+(x.amount||0); },0);
    var wd = monthEntries(p.id, month).filter(function(e){ return e.dayType==="work"; }).length;
    var vdPlanned = monthEntries(p.id, month).filter(function(e){ return e.dayType==="vacation"; }).length;
    var vdUnplanned = monthEntries(p.id, month).filter(function(e){ return e.dayType===DAYTYPE_VACATION_UNPLANNED; }).length;
    var vd = vdPlanned + vdUnplanned;
    var sd = monthEntries(p.id, month).filter(function(e){ return e.dayType==="sick"; }).length;
    var topUpHours = 0;
    if (trade === "kerites"){
      monthEntries(p.id, month).forEach(function(e){
        if (e.dayType==="work") topUpHours += keritesHourBreakdown(e).topUp;
      });
    }
    var bonus = monthAttendanceBonus(p.id, month);
    var total = piece + extrasTotal + bonus;
    var totalNew = pieceNew + extrasTotal + bonus;
    grand += total; grandNew += totalNew;
    var diff = totalNew - total;
    var score = (showCompare && p.hourlyRate) ? (workPiece / p.hourlyRate) : null;
    return '<tr><td><strong>'+escapeHtml(p.name)+'</strong><div class="muted" style="font-size:.76rem">'+wd+' munkanap · '+vd+' szabadság'+(trade==="ajto"&&vd>0?' ('+vdPlanned+' tervezett · '+vdUnplanned+' nem tervezett)':'')+' · '+sd+' beteg'+(topUpHours>0.001?' · '+topUpHours.toFixed(1)+' óra pótlás':'')+'</div></td>' +
      '<td class="mono">'+fmtFt(workPiece)+'</td>' +
      (showCompare ? '<td class="mono">'+fmtFt(workPieceNew)+'</td>' : '') +
      (showCompare ? '<td class="mono">'+(score!=null?score.toFixed(1):"—")+'</td>' : '') +
      '<td class="mono"'+(vacSickPay>0?'':' style="color:var(--ink-muted)"')+'>'+(vacSickPay>0?fmtFt(vacSickPay):"—")+'</td>' +
      '<td><div class="extras-list" data-person="'+p.id+'">' +
        extras.map(function(x){
          return '<div class="extra-row"><input type="text" value="'+escapeHtml(x.label)+'" data-extra-label="'+x.id+'">' +

            '<button class="small-btn danger" data-extra-del="'+x.id+'">✕</button></div>';
        }).join("") +
        '<button class="small-btn" data-extra-add="'+p.id+'">+ Tétel</button>' +
      '</div></td>' +
      '<td class="mono"'+(bonus>0?' style="color:var(--ok)"':' style="color:var(--ink-muted)"')+'>'+(bonus>0?fmtFt(bonus):"—")+'</td>' +
      '<td class="mono"><strong>'+fmtFt(total)+'</strong></td>' +
      (showCompare ? '<td class="mono"><strong>'+fmtFt(totalNew)+'</strong></td><td class="mono"'+(diff<-0.5?' style="color:var(--flag)"':'')+'>'+(Math.abs(diff)<0.5?'—':fmtFt(diff))+'</td>' : '') +
      '</tr>';
  }).join("");
  var grandDiff = grandNew - grand;
  return '<h1 class="admin-h1">Bérszámítás — '+month+'</h1>' +
    '<div class="stat-row"><div class="stat-tile"><span class="n mono">'+fmtFt(STATE.keritesJobLevelPay && showCompare ? grandNew : grand)+'</span><span class="l">Havi összesen ('+(trade==="ajto"?"ajtó":"kerítés")+')'+(showCompare?' — hivatalos: '+(STATE.keritesJobLevelPay?"új":"jelenlegi"):'')+'</span></div>' +
    (showCompare ? '<div class="stat-tile"><span class="n mono" style="color:var(--ink-muted)">'+fmtFt(grand)+'</span><span class="l">Jelenlegi logika szerint</span></div><div class="stat-tile"><span class="n mono">'+fmtFt(grandNew)+'</span><span class="l">Új, munka-szintű logika szerint</span></div><div class="stat-tile"><span class="n mono" style="color:var(--flag)">'+fmtFt(grandDiff)+'</span><span class="l">Különbség</span></div>' : '') +

    '<div class="matrix-scroll"><table class="summary-table"><thead><tr><th>Szerelő</th><th>Teljesítmény bér (jelenlegi)</th>'+(showCompare?'<th>Teljesítmény bér (új, teszt)</th><th>Pontszám</th>':'')+'<th>Szabadság / beteg napidíj</th><th>Extra tételek</th><th>Jelenléti bónusz</th><th>Végösszeg (jelenlegi)</th>'+(showCompare?'<th>Végösszeg (új, teszt)</th><th>Különbség</th>':'')+'</tr></thead>' +

function wireSimulatorTab(){

  });

    if (clocked!=null && clocked<=0) clocked = null;
    var topUp = (clocked!=null && clocked>sim.perf) ? (clocked-sim.perf) : 0;
    var payHours = clocked!=null ? Math.max(sim.perf, clocked) : sim.perf;
    var value = payHours * rate;
    var noteText = sim.overrideLabel
      ? 'Fix díjas tétel ('+escapeHtml(sim.overrideLabel)+') — a létszám-korrekció erre nem vonatkozik.'
      : (crew < 3 ? 'Létszám-korrekció 3 fő alatt nem lép életbe.'

function personMonthTotal(person, trade, m){
  return monthPieceTotalEffective(person.id, m, trade) + monthExtrasTotal(person.id, m) + monthAttendanceBonus(person.id, m);
}
function buildBarChart(labels, series, opts){
  var fmt = (opts && opts.valueFormatter) || function(v){ return String(v); };
  var monthDividers = opts && opts.monthDividers;
  var maxVal = 0;
  series.forEach(function(s){ s.values.forEach(function(v){ if (v>maxVal) maxVal=v; }); });
  maxVal = maxVal || 1;
  var groups = labels.map(function(lbl, i){
    var bars = series.map(function(s){
      var v = s.values[i]||0;
      var h = Math.max(Math.round((v/maxVal)*100), v>0 ? 2 : 0);
      return '<div class="bar-chart-bar" style="height:'+h+'%;background:var('+s.colorVar+')" title="'+escapeHtml(s.label)+' ('+escapeHtml(lbl)+'): '+escapeHtml(fmt(v))+'"><span class="bar-chart-value">'+escapeHtml(fmt(v))+'</span></div>';
    }).join("");
    var groupCls = "bar-chart-group"+(monthDividers && i>0 ? " month-sep" : "");
    return '<div class="'+groupCls+'"><div class="bar-chart-bars">'+bars+'</div><div class="bar-chart-label">'+escapeHtml(lbl)+'</div></div>';
  }).join("");
  var legend = series.length>1 ? '<div class="bar-chart-legend">'+series.map(function(s){
    return '<span class="bar-chart-legend-item"><span class="bar-chart-swatch" style="background:var('+s.colorVar+')"></span>'+escapeHtml(s.label)+'</span>';
  }).join("")+'</div>' : "";
  return '<div class="bar-chart">'+legend+'<div class="bar-chart-plot">'+groups+'</div></div>';
}
function buildBerTrendChart(people, trade, months, selectedPersonId){
  var totals = months.map(function(m){
    return people.reduce(function(s,p){ return s + personMonthTotal(p, trade, m); }, 0);
  });
  var html = buildBarChart(months, [{ label:"Összesen", values:totals, colorVar:"--accent" }], { valueFormatter: fmtFt, monthDividers: true });
  var selected = selectedPersonId ? people.find(function(p){ return p.id===selectedPersonId; }) : null;
  if (selected){
    var personVals = months.map(function(m){ return personMonthTotal(selected, trade, m); });
    html += '<p class="muted" style="margin:-.6rem 0 .6rem;font-size:.8rem">'+escapeHtml(selected.name)+' saját trendje:</p>' +
      buildBarChart(months, [{ label:selected.name, values:personVals, colorVar:"--info" }], { valueFormatter: fmtFt, monthDividers: true });
  }
  return html;
}
function buildAttendanceChart(people, months){

}

      return '<td class="mono'+(i>0?" month-sep":"")+'">'+vacCellHtml(vacPlanned, vacUnplanned)+'</td><td class="mono">'+sick+'</td>';

  return '<div class="matrix-scroll"><table class="summary-table"><thead><tr>'+headTop+'</tr><tr>'+headBottom+'</tr></thead><tbody>'+rows+'</tbody><tfoot>'+footer+'</tfoot></table></div>';
}

function computeKeritesEverProblemJobs(year){
  var jobs = {};
  STATE.entries.forEach(function(e){
    if (e.trade!=="kerites" || e.dayType!=="work") return;
    var entryYear = parseInt(e.date.slice(0,4),10);
    var jobIds = parseAllJobIds(e.orderRef, entryYear).filter(function(j){ return j.year===year; });
    jobIds.forEach(function(parsed){
      if (!jobs[parsed.key]) jobs[parsed.key] = { year:parsed.year, number:parsed.number, entries:[] };
      jobs[parsed.key].entries.push(e);
    });
  });
  var result = [];
  Object.keys(jobs).forEach(function(k){
    var j = jobs[k];
    j.entries.sort(function(a,b){ return a.date.localeCompare(b.date); });
    var problemEntries = j.entries.filter(function(e){ return e.addressStatus==="problem"; });
    if (!problemEntries.length) return;
    var last = j.entries[j.entries.length-1];
    var installerIds = [];
    j.entries.forEach(function(e){ if (installerIds.indexOf(e.personId)===-1) installerIds.push(e.personId); });
    result.push({
      key:k, year:j.year, number:j.number,
      currentStatus: last.addressStatus || null,
      lastDate: last.date,
      installerNames: installerIds.map(function(id){ var p=getPerson(id); return p?p.name:id; }),
      problems: problemEntries.map(function(e){ return { personId:e.personId, date:e.date, comment:e.comment||"", problemType:e.problemType||null, personName:(getPerson(e.personId)||{}).name||e.personId, photos:e.photos||[] }; })
    });
  });
  result.sort(function(a,b){ return b.lastDate.localeCompare(a.lastDate); });
  return result;
}

function buildProblemTypeChart(months){
  var monthSet = {};
  months.forEach(function(m){ monthSet[m] = true; });
  var jobTypeSets = {};
  STATE.entries.forEach(function(e){
    if (e.trade!=="kerites" || e.dayType!=="work" || e.addressStatus!=="problem") return;
    if (!monthSet[e.date.slice(0,7)]) return;
    var entryYear = parseInt(e.date.slice(0,4),10);
    var jobIds = parseAllJobIds(e.orderRef, entryYear);
    var t = (e.problemType && KERITES_PROBLEM_TYPES.indexOf(e.problemType)>=0) ? e.problemType : "Nincs megadva";
    jobIds.forEach(function(parsed){
      if (!jobTypeSets[parsed.key]) jobTypeSets[parsed.key] = {};
      jobTypeSets[parsed.key][t] = true;
    });
  });
  var counts = {};
  KERITES_PROBLEM_TYPES.forEach(function(t){ counts[t] = 0; });
  var unspecified = 0;
  Object.keys(jobTypeSets).forEach(function(key){
    Object.keys(jobTypeSets[key]).forEach(function(t){
      if (t==="Nincs megadva") unspecified++; else counts[t]++;
    });
  });
  var labels = KERITES_PROBLEM_TYPES.slice();
  var values = labels.map(function(t){ return counts[t]; });
  if (unspecified > 0){ labels.push("Nincs megadva"); values.push(unspecified); }
  return buildBarChart(labels, [{ label:"Címek száma", values:values, colorVar:"--flag" }]);
}
function buildAjtoProblemTypeChart(months){
  var monthSet = {};
  months.forEach(function(m){ monthSet[m] = true; });
  var counts = {};
  AJTO_PROBLEM_TYPES.forEach(function(t){ counts[t] = 0; });
  var unspecified = 0;
  STATE.entries.forEach(function(e){
    if (e.trade!=="ajto" || e.dayType!=="work") return;
    if (!monthSet[e.date.slice(0,7)]) return;
    if (e.doorLines && e.doorLines.length){
      e.doorLines.forEach(function(l){
        if (l.status!=="problem") return;
        var t = (l.problemType && AJTO_PROBLEM_TYPES.indexOf(l.problemType)>=0) ? l.problemType : "Nincs megadva";
        if (t==="Nincs megadva") unspecified++; else counts[t]++;
      });
    } else if (e.addressStatus==="problem"){
      var t2 = (e.problemType && AJTO_PROBLEM_TYPES.indexOf(e.problemType)>=0) ? e.problemType : "Nincs megadva";
      if (t2==="Nincs megadva") unspecified++; else counts[t2]++;
    }
  });
  var labels = AJTO_PROBLEM_TYPES.slice();
  var values = labels.map(function(t){ return counts[t]; });
  if (unspecified > 0){ labels.push("Nincs megadva"); values.push(unspecified); }
  return buildBarChart(labels, [{ label:"Ajtók száma", values:values, colorVar:"--flag" }]);
}

function computeKeritesJobLifecycles(){
  var jobs = {};
  STATE.entries.forEach(function(e){
    if (e.trade!=="kerites" || e.dayType!=="work") return;
    var entryYear = parseInt(e.date.slice(0,4),10);
    var jobIds = parseAllJobIds(e.orderRef, entryYear);
    jobIds.forEach(function(parsed){
      if (!jobs[parsed.key]) jobs[parsed.key] = [];
      jobs[parsed.key].push(e);
    });
  });
  var result = [];
  Object.keys(jobs).forEach(function(k){
    var list = jobs[k];
    var first = list.reduce(function(a,b){ return a.date<=b.date ? a : b; });
    result.push({
      key: k,
      startMonth: first.date.slice(0,7),
      everProblem: list.some(function(e){ return e.addressStatus==="problem"; })
    });
  });
  return result;
}
function buildProblemTrendChart(months){
  var jobs = computeKeritesJobLifecycles();
  var totals = months.map(function(m){
    return jobs.filter(function(j){ return j.startMonth===m; }).length;
  });
  var problems = months.map(function(m){
    return jobs.filter(function(j){ return j.startMonth===m && j.everProblem; }).length;
  });
  return '<p class="muted" style="font-size:.8rem;margin-bottom:.8rem;max-width:62ch">Az a hónap számít, amikor a munka elindult (az első bejegyzés dátuma) — a még nyitott (be nem fejezett) címek is beleszámítanak.</p>' +
    buildBarChart(months, [
      { label:"Összes cím", values:totals, colorVar:"--ok" },
      { label:"Ebből valaha problémás volt", values:problems, colorVar:"--flag" }
    ], { monthDividers: true });
}

  document.getElementById("a-save-pricing").onclick = function(){
    if (trade==="ajto"){
      var priceRows = [];
      document.querySelectorAll('[data-price-role]').forEach(function(inp){
        var rk = inp.getAttribute("data-price-role");
        var key = inp.getAttribute("data-price-key");
        var val = parseFloat(inp.value)||0;
        STATE.catalog.ajto.rolePrices[rk][key] = val;
        priceRows.push({ role:rk, item_key:key, price:val });
      });
      STATE.catalog.ajto.travelRates.vezeto = parseFloat(document.getElementById("a-travel-vezeto").value)||0;
      STATE.catalog.ajto.travelRates.seged = parseFloat(document.getElementById("a-travel-seged").value)||0;
      STATE.catalog.ajto.overtimeRates.vezeto = parseFloat(document.getElementById("a-overtime-vezeto").value)||0;
      STATE.catalog.ajto.overtimeRates.seged = parseFloat(document.getElementById("a-overtime-seged").value)||0;
      STATE.catalog.ajto.repairRates.vezeto = parseFloat(document.getElementById("a-repair-vezeto").value)||0;
      STATE.catalog.ajto.repairRates.seged = parseFloat(document.getElementById("a-repair-seged").value)||0;
      STATE.people.forEach(function(p){
        if (p.trade!=="ajto") return;
        var rk = roleToKey(p.role);
        p.travelFeePerDay = rk ? (STATE.catalog.ajto.travelRates[rk]||0) : 0;
      });
      Promise.all([
        sbUpsert("ajto_role_prices", priceRows, "role,item_key"),
        sb("settings?id=eq.1", { method:"PATCH", body:{travel_rate_vezeto: STATE.catalog.ajto.travelRates.vezeto, travel_rate_seged: STATE.catalog.ajto.travelRates.seged, overtime_rate_vezeto: STATE.catalog.ajto.overtimeRates.vezeto, overtime_rate_seged: STATE.catalog.ajto.overtimeRates.seged, repair_rate_vezeto: STATE.catalog.ajto.repairRates.vezeto, repair_rate_seged: STATE.catalog.ajto.repairRates.seged}, prefer:"return=minimal" })
      ]).then(function(){ toast("Árazás mentve."); render(); }).catch(sbFail);
    } else {
      var hourRows = [];
      document.querySelectorAll('[data-hours-key]').forEach(function(inp){
        var it = STATE.catalog.kerites.items.find(function(x){ return x.key===inp.getAttribute("data-hours-key"); });
        var val = parseFloat(inp.value)||0;
        if (it) it.hoursPerUnit = val;
        hourRows.push({ key: inp.getAttribute("data-hours-key"), hours_per_unit: val });
      });
      STATE.catalog.kerites.fixedDailyHours.utazas = parseFloat(document.getElementById("a-fixed-utazas").value)||0;
      STATE.catalog.kerites.fixedDailyHours.jarulekos = parseFloat(document.getElementById("a-fixed-jarulekos").value)||0;
      Promise.all([
        Promise.all(hourRows.map(function(r){ return sb("catalog_items?key=eq."+encodeURIComponent(r.key), { method:"PATCH", body:{hours_per_unit:r.hours_per_unit}, prefer:"return=minimal" }); })),
        sb("settings?id=eq.1", { method:"PATCH", body:{ kerites_utazas_hours: STATE.catalog.kerites.fixedDailyHours.utazas, kerites_jarulekos_hours: STATE.catalog.kerites.fixedDailyHours.jarulekos }, prefer:"return=minimal" })
      ]).then(function(){ toast("Árazás mentve."); render(); }).catch(sbFail);
    }
  };
}

function openEntryModal(personId, date){
  var person = getPerson(personId);
  var e = entryFor(personId, date);
  var body;
  if (!e){
    body = '<p class="muted">Nincs rögzített bejegyzés erre a napra.</p>';
  } else if (isVacationDayType(e.dayType) || e.dayType==="sick"){
    var pillHtml = e.dayType==="vacation"
      ? '<span class="pill info">'+(person.trade==="ajto"?"Tervezett szabadság":"Szabadság")+'</span>'
      : (e.dayType===DAYTYPE_VACATION_UNPLANNED
        ? '<span class="pill warn">Nem tervezett szabadság</span>'
        : '<span class="pill" style="background:var(--sick-bg);color:var(--sick)">Betegállomány</span>');
    body = '<p>'+pillHtml+'</p>' +
      '<div class="recent-item"><strong>Napidíj</strong><strong class="mono">'+fmtFt(calcEntryValue(e,person))+'</strong></div>' +
      (roleKey(person.role) ? '' : '<p class="muted" style="font-size:.8rem">Nincs beállítva a szerepköre, ezért 0 Ft-tal számol — állítsd be a Szerelők fülön.</p>') +
      (e.comment ? '<p style="margin-top:.6rem">"'+escapeHtml(e.comment)+'"</p>' : '');
  } else {
    var catalog = STATE.catalog[person.trade];
    var overrideItem = person.trade==="kerites" ? keritesOverrideItem(e) : null;
    var rows = catalog.items.filter(function(it){ return !it.override && (e.items||{})[it.key]; })
      .map(function(it){ return '<div class="recent-item"><span>'+escapeHtml(it.label)+'</span><span class="mono">'+e.items[it.key]+' db</span></div>'; }).join("");
    var anomaly = isHourAnomaly(e);
    var ajtoHasLines = person.trade==="ajto" && e.doorLines && e.doorLines.length;
    var addrStatusPill = "";
    if (person.trade==="kerites" && e.addressStatus){
      if (e.addressStatus==="done") addrStatusPill = '<p class="pill ok" style="margin-bottom:.6rem">✓ Cím befejezve</p>';
      else if (e.addressStatus==="continue") addrStatusPill = '<p class="pill warn" style="margin-bottom:.6rem">↻ Folytatni kell a címet</p>';
      else if (e.addressStatus==="problem") addrStatusPill = '<p class="pill flag" style="margin-bottom:.6rem">✕ Probléma merült fel, megakadt a szerelés'+(e.problemType?' — '+escapeHtml(e.problemType):'')+'</p>';
    } else if (person.trade==="ajto" && !ajtoHasLines && e.addressStatus){
      if (e.addressStatus==="done") addrStatusPill = '<p class="pill ok" style="margin-bottom:.6rem">✓ Beépítés kész</p>';
      else if (e.addressStatus==="problem") addrStatusPill = '<p class="pill flag" style="margin-bottom:.6rem">✕ Probléma merült fel, vissza kell menni'+(e.problemType?' — '+escapeHtml(e.problemType):'')+'</p>';
    }
    var metalCoverSizesHtml = (!ajtoHasLines && e.metalCoverSizes && e.metalCoverSizes.length)
      ? '<div class="recent-item" style="display:block"><strong>Fém takaró méretek (mm)</strong><br>' +
        e.metalCoverSizes.map(function(c,i){ return (c.excluded || c.a==null || c.b==null) ? null : escapeHtml(METAL_COVER_NAMES[i])+': '+c.a+' × '+c.b; }).filter(Boolean).join('<br>') +
        '</div>'
      : '';
    var ajtoDoorLinesHtml = ajtoHasLines ? e.doorLines.map(function(l){
      var statusPill = l.status==="done" ? '<span class="pill ok">✓ Kész</span>' : (l.status==="problem" ? '<span class="pill flag">✕ Probléma'+(l.problemType?' — '+escapeHtml(l.problemType):'')+'</span>' : (l.status==="failed" ? '<span class="pill" style="background:var(--warn-bg);color:var(--warn)">⊘ Meghiúsult beépítés</span>' : ''));
      var linePhotos = (e.photos||[]).filter(function(p){ return p.doorLineId===l.lineId; });
      var photosHtml = linePhotos.length ? '<div class="photo-grid" style="margin-top:.4rem">'+linePhotos.map(function(p){ return '<div class="photo-thumb"><img src="'+photoPublicUrl(p.path)+'"></div>'; }).join("")+'</div>' : '';
      var mcHtml = (l.metalCoverSizes && l.metalCoverSizes.length && l.metalCoverSizes.some(function(c){ return !c.excluded && c.a!=null && c.b!=null; }))
        ? '<p class="muted" style="margin-top:.3rem">Fém takaró méretek (mm): '+l.metalCoverSizes.map(function(c,i){ return (c.excluded||c.a==null||c.b==null)?null:escapeHtml(METAL_COVER_NAMES[i])+': '+c.a+'×'+c.b; }).filter(Boolean).join(', ')+'</p>'
        : '';
      return '<div class="recent-item" style="display:block;margin-bottom:.6rem">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem"><strong>'+escapeHtml(l.address || (l.doorType ? ajtoItemLabel(l.doorType) : "Ajtó"))+(l.qty>1?' × '+l.qty:'')+'</strong>'+statusPill+'</div>' +
        (l.orderRef ? '<p class="muted" style="margin:.2rem 0 0">Munka: '+escapeHtml(l.orderRef)+'</p>' : '') +
        ((l.status==="problem"||l.status==="failed") && l.comment ? '<p style="margin-top:.3rem">"'+escapeHtml(l.comment)+'"</p>' : '') +
        mcHtml + photosHtml +
        '</div>';
    }).join("") : "";
    body = addrStatusPill +
      metalCoverSizesHtml +
      ajtoDoorLinesHtml +
      (anomaly && !e.reviewedOk ? '<p class="pill flag" style="margin-bottom:.6rem">⚠ Magas teljesítmény — ellenőrizd, mielőtt kifizeted!</p>' : '') +
      (anomaly && e.reviewedOk ? '<p class="pill ok" style="margin-bottom:.6rem">✓ Ellenőrizve, rendben találtad</p>' : '') +
      (e.orderRef? '<p class="muted">Munka: '+escapeHtml(e.orderRef)+'</p>' : '') +
      (person.trade==="kerites" && e.crewSize ? '<p class="muted">Bevallott létszám: '+e.crewSize+' fő'+(keritesActualCrewSize(e) && keritesActualCrewSize(e)>e.crewSize ? ' <span style="color:var(--flag)">(ténylegesen azonosítva: '+keritesActualCrewSize(e)+' fő)</span>' : '')+'</p>' : '') +
      (overrideItem ? '<p class="pill info">'+escapeHtml(overrideItem.label)+' nap — '+overrideItem.hoursPerUnit+' óra (fix)</p>' : '') +
      (person.trade==="ajto" && e.repairDay ? '<p class="pill info">Egész napos javítás</p>' : '') +
      (person.trade==="ajto" && e.repairDay ? '' : '<div>'+ (rows || '<p class="muted">Nincs tétel.</p>') + '</div>') +
      (person.trade==="ajto" && e.workStart && e.workEnd ? '<div class="recent-item"><span>Munkaidő</span><span class="mono">'+e.workStart+'–'+e.workEnd+'</span></div>' : '') +
      (person.trade==="ajto" && !e.repairDay && e.teamColor ? '<div class="recent-item"><span>Csapatszín</span><span class="mono">'+escapeHtml(e.teamColor)+'</span></div>' : '') +
      (person.trade==="ajto" && e.repairDay ? '<div class="recent-item"><span>Javítási órabér</span><span class="mono">'+(workedHoursOf(e)||0).toFixed(2)+' óra × '+fmtFt(ajtoRepairRate(person))+'/óra = '+fmtFt(ajtoRepairPay(e,person))+'</span></div>' : '') +
      (person.trade==="ajto" && !e.repairDay && ajtoOvertimeHours(e) > 0 ? '<div class="recent-item"><span>Túlóra (9 óra fölött)</span><span class="mono">'+ajtoOvertimeHours(e).toFixed(2)+' óra × '+fmtFt(ajtoOvertimeRate(person))+'/óra = '+fmtFt(ajtoOvertimePay(e,person))+'</span></div>' : '') +
      (person.trade==="kerites" && (e.bontasFestesOra||e.garanciaEgyebOra) ? '<div class="recent-item"><span>Bontás/festés + garancia</span><span class="mono">'+((e.bontasFestesOra||0)+(e.garanciaEgyebOra||0))+' óra</span></div>' : '') +
      (person.trade==="kerites" ? keritesHoursInfoHtml(e) : '') +
      '<div class="recent-item"><strong>Érték</strong><strong class="mono">'+fmtFt(calcEntryValue(e,person))+'</strong></div>' +
      (e.comment ? '<p style="margin-top:.6rem">"'+escapeHtml(e.comment)+'"</p>' : '');
  }
  var showReview = e && isHourAnomaly(e);
  var bg = h('<div class="modal-bg"><div class="modal"><h3>'+escapeHtml(person.name)+' — '+fmtDate(date)+'</h3><div style="margin-top:.7rem">'+body+'</div>' +
    '<div style="display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap"><button class="ghost" id="m-close">Bezár</button>' +
    (e ? '<button class="ghost" id="m-edit">Szerkesztés</button><button class="ghost danger" id="m-del">Törlés</button>' : '') +
    (showReview ? '<button class="ghost" id="m-review">'+(e.reviewedOk ? "Ellenőrzés visszavonása" : "Ellenőrizve, rendben")+'</button>' : '') +
    '</div></div></div>');
  document.body.appendChild(bg);
  bg.addEventListener("click", function(ev){ if (ev.target===bg) bg.remove(); });
  bg.querySelector("#m-close").onclick = function(){ bg.remove(); };
  if (e){
    bg.querySelector("#m-edit").onclick = function(){
      bg.remove();
      nav.view = "entry"; nav.personId = personId; nav.editDate = date;
      render();
    };
    bg.querySelector("#m-del").onclick = function(){
      if (!confirm("Biztosan törlöd ezt a bejegyzést?")) return;
      STATE.entries = STATE.entries.filter(function(x){ return !(x.personId===personId && x.date===date); });
      bg.remove();
      deleteEntry(personId, date, function(){ render(); });
    };
  }
  if (showReview){
    bg.querySelector("#m-review").onclick = function(){
      e.reviewedOk = !e.reviewedOk;
      bg.remove();
      sb("entries?person_id=eq."+encodeURIComponent(personId)+"&date=eq."+date, { method:"PATCH", body:{reviewed_ok:e.reviewedOk}, prefer:"return=minimal" })
        .then(function(){ render(); })
        .catch(sbFail);
    };
  }
}

function wireNav(){
  document.querySelectorAll("[data-nav]").forEach(function(el){
    el.onclick = function(ev){
      ev.preventDefault();
      var target = el.getAttribute("data-nav");
      if (target === "landing"){ nav.view="landing"; nav.trade=null; nav.personId=null; }
      else if (target === "names"){ nav.view="names"; }
      else if (target === "adminpin"){ nav.view="adminpin"; }
      render();
    };
  });
}

render();
loadState(function(){ render(); });
})();
